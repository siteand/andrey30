<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Курсы валют">
    <title>Конвертер валют</title>

    <link rel="icon" type="image/png" sizes="32x32" href="icons2/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons2/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons2/apple-touch-icon.png">
    <link rel="manifest" href="currency.webmanifest">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-color: #333;
            --text-muted: #888;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --button-bg: #007bff;
            --button-text: #fff;
            --row-hover: #f5f9ff;
            --active-bg: #e7f1ff;
            --active-border: #007bff;
            --divider: #eef0f3;
            --shadow: rgba(0, 60, 150, 0.08);
            --dragging-bg: #e7f1ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; }
        html { scroll-behavior: smooth; }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 0;
            transition: min-height 0.25s ease;
        }

        .main-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            width: 100%;
        }

        .calculator {
            transition: none;
        }
        body.editing .calculator {
            transform: none;
        }

        footer {
            text-align: center;
            padding: 20px 10px 10px;
            color: gray;
            font-size: 14px;
            font-family: Arial, sans-serif;
            width: 100%;
        }

        .calculator {
            background: var(--input-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h2 {
            margin-bottom: 6px;
            color: var(--text-color);
            text-align: center;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        button {
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .actions-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .actions-row .add-btn,
        .actions-row .status-btn {
            flex: 1;
        }

        .status-btn {
            background: var(--input-bg);
            color: var(--text-muted);
            border: 1px solid var(--input-border);
            border-radius: 5px;
            font-weight: normal;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-btn:hover {
            background: var(--row-hover);
            border-color: var(--button-bg);
            color: var(--text-color);
        }
        .status-btn .refresh-icon {
            flex-shrink: 0;
            display: block;
            transition: transform 0.2s;
        }
        .status-btn:active .refresh-icon { transform: scale(0.9); }
        .status-btn.spinning .refresh-icon { animation: spin 0.8s linear infinite; }
        .status-btn .status-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .source-note {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.25s ease, opacity 0.2s ease;
        }
        .source-note > span { display: block; padding: 8px 4px 0; }
        .note-sep {
            display: inline-block;
            width: 1px;
            height: 9px;
            margin: 0 8px;
            vertical-align: middle;
            background: var(--input-border);
        }
        .actions-row.editing ~ .source-note,
        body.editing .source-note {
            max-height: 40px;
            opacity: 1;
        }

        .add-btn {
            background: var(--input-bg);
            color: var(--button-bg);
            border: 1px dashed var(--button-bg);
            font-weight: normal;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .add-btn:hover { background: var(--row-hover); }

        .actions-row.editing .status-btn { display: none; }
        .actions-row.editing .add-btn { display: inline-flex; }

        .edit-btn {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--button-bg);
            border-radius: 5px;
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
        }

        .edit-btn:hover {
            background: var(--row-hover);
            border-color: var(--button-bg);
        }

        .edit-btn.active {
            background: var(--button-bg);
            border-color: var(--button-bg);
            color: var(--button-text);
        }

        .edit-btn svg {
            display: block;
            transition: transform 0.2s;
        }
        .edit-btn:active svg {
            transform: scale(0.9);
        }
        .edit-btn .icon-check { display: none; }
        .edit-btn.active .icon-pencil { display: none; }
        .edit-btn.active .icon-check { display: block; }

        .currency-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .currency-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            background: var(--input-bg);
            text-align: left;
            transition: box-shadow 0.15s, transform 0.15s;
        }
        .currency-row.active {
            background: var(--active-bg);
            border-color: var(--active-border);
        }
        .currency-row.dragging {
            background: var(--dragging-bg);
            box-shadow: 0 6px 20px var(--shadow);
            z-index: 10;
            border-color: var(--button-bg);
        }

        .drag-handle {
            color: var(--text-muted);
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            font-size: 18px;
            padding: 4px 2px;
            flex-shrink: 0;
            line-height: 1;
            touch-action: none;
            display: none;
        }
        .drag-handle:active { cursor: grabbing; }

        .flag-img {
            width: 32px;
            height: 24px;
            border-radius: 3px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--divider);
        }

        .flag-img[alt="CHF"] {
            width: 32px;
            height: 32px;
            object-fit: cover;
            background: transparent;
        }

        .currency-info { flex: 1; min-width: 0; }
        .currency-code {
            font-weight: bold;
            font-size: 14px;
            color: var(--text-color);
        }
        .currency-name {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .amount-input {
            width: 120px;
            flex: 0 0 120px;
            min-width: 120px;
            padding: 8px;
            text-align: right;
            font-size: 16px;
            font-weight: bold;
            transition: width 0.18s ease, flex-basis 0.18s ease;
        }
        .amount-input.is-wide {
            width: 175px;
            flex-basis: 175px;
            min-width: 175px;
        }
        .amount-input:focus {
            outline: none;
            border-color: var(--button-bg);
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            width: auto;
            padding: 4px 6px;
            display: none;
        }
        .remove-btn:hover { background: none; color: #dc3545; }

        .currency-list.is-editing .drag-handle,
        .currency-list.is-editing .remove-btn {
            display: block;
        }

        .modal-bg {
            position: fixed; inset: 0;
            background: rgba(0, 30, 80, 0.5);
            z-index: 100;
            display: none;
            justify-content: center; align-items: center;
            padding: 10px;
        }
        .modal-bg.open { display: flex; }
        .modal {
            background: var(--input-bg);
            border-radius: 10px;
            width: 100%; max-width: 400px;
            max-height: 90vh; max-height: 90dvh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            padding: 15px;
            border-bottom: 1px solid var(--divider);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { font-size: 16px; color: var(--button-bg); }
        .modal-close {
            background: none; border: none;
            font-size: 22px; color: var(--text-muted);
            cursor: pointer; width: auto;
            padding: 0 6px; line-height: 1;
        }
        .search-wrap {
            padding: 10px 15px;
            border-bottom: 1px solid var(--divider);
        }
        .search-wrap input { font-size: 14px; padding: 10px; cursor: pointer; }

        .modal-list {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex: 1;
        }
        .modal-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            border-bottom: 1px solid var(--divider);
            cursor: pointer;
        }
        .modal-row:hover { background: var(--row-hover); }
        .modal-row.disabled { opacity: 0.4; pointer-events: none; }
        .modal-row-info { flex: 1; min-width: 0; }
        .modal-row-code { font-weight: bold; font-size: 14px; color: var(--text-color); }
        .modal-row-name { font-size: 12px; color: var(--text-muted); }
        .modal-row-rate {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
        }
        .check {
            color: var(--button-bg);
            font-weight: bold;
            font-size: 16px;
        }
        .empty {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }



        .side-back-zone {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: calc((100vw - 400px) / 2);
            display: none;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            z-index: 10;
        }

        .side-back-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: gray;
            opacity: 0.45;
            transform: translate(-50%, -50%);
            transition: opacity 0.2s, transform 0.2s, background-color 0.2s;
        }

        .side-back-arrow svg {
            width: 24px;
            height: 24px;
            display: block;
            flex: 0 0 auto;
        }

        .side-back-zone:hover .side-back-arrow {
            opacity: 0.85;
            transform: translate(-50%, -50%) translateX(-4px);
            background-color: rgba(128, 128, 128, 0.10);
        }

        @media (min-width: 769px) {
            .side-back-zone {
                display: block;
            }
        }

        @media (max-width: 768px) {
            input, select, button { font-size: 14px; padding: 10px; }
            .amount-input {
                font-size: 15px;
                width: 110px;
                flex-basis: 110px;
                min-width: 110px;
                padding: 8px;
            }
            .amount-input.is-wide {
                width: 155px;
                flex-basis: 155px;
                min-width: 155px;
            }
            .edit-btn { width: 40px; height: 40px; }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1e1e1e;
                --text-color: #f4f4f9;
                --text-muted: #999;
                --input-bg: #333;
                --input-border: #555;
                --button-bg: #4a9eff;
                --button-text: #fff;
                --row-hover: #333;
                --active-bg: #1a3a5c;
                --active-border: #4a9eff;
                --divider: #444;
                --shadow: rgba(0, 0, 0, 0.4);
                --dragging-bg: #1a3a5c;
            }
            .add-btn:hover { background: #333; }
        }
    </style>
</head>

    <div class="main-wrap">

            <button class="add-btn" id="addBtn">+ Добавить валюту</button>
            <button class="edit-btn" id="editBtn" title="Редактировать список">

                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>

                <svg class="icon-check" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </button>
        </div>

        <div class="currency-list" id="currencyList"></div>

        <div class="source-note" id="sourceNote"><span id="sourceNoteText"></span></div>
    </div>
    </div>

    <div class="modal-bg" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Выберите валюту</h3>
                <button class="modal-close" id="modalClose">✕</button>

            <div class="search-wrap">
                <input type="text" id="searchBox" placeholder="🔍 Нажмите для поиска" readonly>
            </div>
            <div class="modal-list" id="modalList"></div>
        </div>
    </div>

let rates = {};
let rateDate = null;
let lastFetchTime = 0;

const STORAGE_KEY = 'cbrConverter_v6';
const CACHE_KEY = 'cbrConverter_cache_v6';
const ONE_HOUR = 60 * 60 * 1000;

function applyFallbackRates() {
    for (const code in FALLBACK_RATES_RUB) {
        if (rates[code] === undefined) {
            rates[code] = 1 / FALLBACK_RATES_RUB[code];
        }
    }
    rates.RUB = 1;
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            selected, activeCode, activeAmount
        }));
    } catch (e) {}
}

function loadState() {
    try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (Array.isArray(s.selected) && s.selected.length) selected = s.selected;
        if (s.activeCode) activeCode = s.activeCode;
        if (typeof s.activeAmount === 'number') activeAmount = s.activeAmount;

        const migrate = (code) => {
            if (code === 'XAU_G') return 'XAU';
            if (code === 'XAG_G') return 'XAG';
            if (code === 'XPT_G') return 'XPT';
            if (code === 'XPD_G') return 'XPD';
            return code;
        };
        selected = selected.map(migrate);
        if (activeCode) activeCode = migrate(activeCode);
    } catch (e) {}
}

function saveCache() {
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
            rates, rateDate, fetchedAt: lastFetchTime
        }));
    } catch (e) {}
}

function loadCache() {
    try {
        const c = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
        if (c.rates && c.fetchedAt) {
            rates = c.rates;
            rateDate = c.rateDate ? new Date(c.rateDate) : null;
            lastFetchTime = c.fetchedAt;
            return true;
        }
    } catch (e) {}
    return false;
}

async function fetchFromJsDelivr(now) {
    const urls = [
        `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/rub.json?_=${now}`,
        `https://latest.currency-api.pages.dev/v1/currencies/rub.json?_=${now}`
    ];
    const METAL_CODES = ['XAU', 'XAG', 'XPT', 'XPD'];
    const OZ_TO_G = 31.1035; 
    for (const url of urls) {
        try {
            const res = await fetch(url);
            if (!res.ok) continue;
            const data = await res.json();
            if (data && data.rub) {
                const result = { RUB: 1 };
                const cbDate = data.date ? new Date(data.date) : new Date();
                for (const code in CURRENCY_META) {
                    const lower = code.toLowerCase();
                    if (data.rub[lower] && data.rub[lower] > 0) {
                        result[code] = 1 / data.rub[lower];
                    }
                }
                for (const metal of METAL_CODES) {
                    const lower = metal.toLowerCase();
                    if (data.rub[lower] && data.rub[lower] > 0) {
                        const ozInRub = 1 / data.rub[lower];
                        result[metal] = ozInRub / OZ_TO_G;  
                        result[metal + '_U'] = ozInRub;      
                    }
                }
                return { rates: result, date: cbDate };
            }
        } catch (e) {}
    }
    return null;
}

async function fetchFromCBR(now) {
    try {
        const res = await fetch('https://www.cbr-xml-daily.ru/daily_json.js?_=' + now);
        if (!res.ok) return null;
        const data = await res.json();
        const result = { RUB: 1 };
        for (const code in data.Valute) {
            const v = data.Valute[code];
            result[code] = v.Value / v.Nominal;
        }
        return { rates: result, date: new Date(data.Date) };
    } catch (e) {
        return null;
    }
}

const CG_IDS = {
    BTC: 'bitcoin', ETH: 'ethereum', USDT: 'tether', BNB: 'binancecoin',
    SOL: 'solana', XRP: 'ripple', DOGE: 'dogecoin', TON: 'the-open-network'
};

async function fetchCryptoFromCoinGecko() {
    const ids = Object.values(CG_IDS).join(',');
    const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=rub`;
    try {
        const res = await fetch(url);
        if (!res.ok) return null;
        const data = await res.json();
        const out = {};
        for (const code in CG_IDS) {
            const d = data[CG_IDS[code]];
            if (d && d.rub > 0) out[code] = d.rub;
        }
        return Object.keys(out).length ? out : null;
    } catch (e) {
        return null;
    }
}

async function fetchRates(force = false) {
    const now = Date.now();
    if (!force && lastFetchTime && (now - lastFetchTime < ONE_HOUR)) {
        updateStatus();
        return true;
    }

    document.getElementById('statusText').textContent = 'Обновление курсов…';

    const [cbrResult, jsdResult, cryptoResult] = await Promise.all([
        fetchFromCBR(now),
        fetchFromJsDelivr(now),
        fetchCryptoFromCoinGecko()
    ]);

    let anyOk = false;
    const fresh = { RUB: 1 };

    if (cbrResult) {
        for (const code in cbrResult.rates) {
            fresh[code] = cbrResult.rates[code];
        }
        rateDate = cbrResult.date;
        anyOk = true;
    }

    if (jsdResult) {
        for (const code in jsdResult.rates) {
            if (fresh[code] === undefined) {
                fresh[code] = jsdResult.rates[code];
            }
        }
        if (!rateDate) rateDate = jsdResult.date;
        anyOk = true;
    }

    if (anyOk) {
        rates = fresh;          
        applyFallbackRates();   
    }

    if (cryptoResult) {
        for (const code in cryptoResult) {
            rates[code] = cryptoResult[code];
        }
        anyOk = true;
    }

    if (anyOk) {
        if (!rateDate) rateDate = new Date();
        lastFetchTime = now;
        saveCache();
        updateStatus();
        return true;
    } else {
        document.getElementById('statusText').textContent = 'Нет сети — данные приблизительные';
        return false;
    }
}

function updateStatus() {
    if (!lastFetchTime) return;
    const fetched = new Date(lastFetchTime);
    const d = fetched.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    const t = fetched.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('statusText').textContent = `Обновлено ${d} · ${t}`;

    const note = document.getElementById('sourceNoteText');
    if (note) {
        const cd = rateDate
            ? new Date(rateDate).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })
            : '—';
        note.innerHTML = `Курс на ${cd} · ЦБ РФ<span class="note-sep"></span>Крипта на ${t} · CoinGecko`;
    }
}

function convert(amount, fromCode, toCode) {
    if (!rates[fromCode] || !rates[toCode]) return 0;
    const inRub = amount * rates[fromCode];
    return inRub / rates[toCode];
}

function formatAmount(n) {
    if (!isFinite(n)) return '0';
    const abs = Math.abs(n);
    let decimals = 2;
    if (abs >= 10000) decimals = 0;
    else if (abs >= 1) decimals = 2;
    else if (abs >= 0.01) decimals = 4;
    else decimals = 6;

    const rounded = Math.round(n * Math.pow(10, decimals)) / Math.pow(10, decimals);
    if (rounded === Math.trunc(rounded)) {
        decimals = 0;
    }

    return n.toLocaleString('ru-RU', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
    });
}

const AUTO_WIDE_THRESHOLD = 10000000000; // 10 млрд — с этого значения обычного поля уже не хватает

function updateAmountInputWidth(input, value) {
    if (!input) return;
    const num = Number(value);
    input.classList.toggle('is-wide', Number.isFinite(num) && Math.abs(num) >= AUTO_WIDE_THRESHOLD);
}

function renderList() {
    const list = document.getElementById('currencyList');
    list.innerHTML = '';

    selected.forEach(code => {
        const meta = CURRENCY_META[code] || { country: 'un', name: code };
        const row = document.createElement('div');
        row.className = 'currency-row' + (code === activeCode ? ' active' : '');
        row.dataset.code = code;

        const value = (code === activeCode)
            ? activeAmount
            : convert(activeAmount, activeCode, code);

        row.innerHTML = `
            <span class="drag-handle">≡</span>
            <img class="flag-img" src="${flagUrl(meta.country)}" alt="${code}" loading="lazy" onerror="this.style.visibility='hidden'">
            <div class="currency-info">
                <div class="currency-code">${code}</div>
                <div class="currency-name">${meta.name}</div>
            </div>
            <input type="text" inputmode="decimal" enterkeyhint="done" class="amount-input"
                   value="${formatAmount(value)}" data-code="${code}">
            <button class="remove-btn" data-remove="${code}" title="Убрать">✕</button>
        `;
        list.appendChild(row);
    });

    list.querySelectorAll('.amount-input').forEach(inp => {
        const initialRaw = inp.value.replace(/\s/g, '').replace(',', '.');
        updateAmountInputWidth(inp, parseFloat(initialRaw));

        inp.addEventListener('focus', (e) => {
            const code = e.target.dataset.code;
            activeCode = code;
            const raw = e.target.value.replace(/\s/g, '').replace(',', '.');
            activeAmount = parseFloat(raw) || 0;
            document.querySelectorAll('.currency-row').forEach(r => r.classList.remove('active'));
            e.target.closest('.currency-row').classList.add('active');
            e.target.value = '';
        });
        inp.addEventListener('input', (e) => {
            const el = e.target;
            const code = el.dataset.code;

            const oldValue = el.value;
            const cursorPos = el.selectionStart;

            let raw = oldValue.replace(/[^\d.,]/g, '').replace(',', '.');
            const parts = raw.split('.');
            if (parts.length > 2) raw = parts[0] + '.' + parts.slice(1).join('');

            const spacesBeforeOld = (oldValue.slice(0, cursorPos).match(/\s/g) || []).length;
            const digitsBeforeCursor = cursorPos - spacesBeforeOld;

            const dotIdx = raw.indexOf('.');
            let intPart = dotIdx >= 0 ? raw.slice(0, dotIdx) : raw;
            const fracPart = dotIdx >= 0 ? raw.slice(dotIdx) : '';
            intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            const newValue = intPart + fracPart;

            el.value = newValue;

            let newCursor = 0;
            let digitCount = 0;
            for (let i = 0; i < newValue.length && digitCount < digitsBeforeCursor; i++) {
                if (/\d/.test(newValue[i])) digitCount++;
                newCursor = i + 1;
            }
            if (digitsBeforeCursor === 0) newCursor = 0;
            try { el.setSelectionRange(newCursor, newCursor); } catch (err) {}

            const num = parseFloat(raw);
            if (!isNaN(num)) {
                activeCode = code;
                activeAmount = num;
                updateAmountInputWidth(el, num);
                document.querySelectorAll('.amount-input').forEach(other => {
                    if (other.dataset.code !== code) {
                        const v = convert(num, code, other.dataset.code);
                        other.value = formatAmount(v);
                        updateAmountInputWidth(other, v);
                    }
                });
                saveState();
            } else {
                updateAmountInputWidth(el, 0);
            }
        });
        inp.addEventListener('blur', (e) => {
            const raw = e.target.value.replace(/\s/g, '').replace(',', '.');
            if (raw === '') {
                const code = e.target.dataset.code;
                const v = (code === activeCode) ? activeAmount : convert(activeAmount, activeCode, code);
                e.target.value = formatAmount(v);
                updateAmountInputWidth(e.target, v);
                return;
            }
            const num = parseFloat(raw) || 0;
            e.target.value = formatAmount(num);
            updateAmountInputWidth(e.target, num);
        });
        inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === 'Tab' || e.keyCode === 13 || e.keyCode === 9) {
                e.preventDefault();
                e.target.blur();
            }
        });
    });

    list.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const code = e.currentTarget.dataset.remove;
            selected = selected.filter(c => c !== code);
            if (activeCode === code) {
                activeCode = selected[0] || null;
                activeAmount = 1;
            }
            saveState();
            renderList();
        });
    });

    setupDragAndDrop();
}

function setupDragAndDrop() {
    const list = document.getElementById('currencyList');
    let draggedRow = null;
    let startY = 0;
    let startTop = 0;
    let placeholder = null;
    let lastClientY = 0;
    let moveFrame = null;

    function animateRows(changeDom) {
        const rowsBefore = Array.from(list.querySelectorAll('.currency-row:not(.dragging)'));
        const first = new Map(rowsBefore.map(row => [row, row.getBoundingClientRect().top]));

        changeDom();

        const rowsAfter = Array.from(list.querySelectorAll('.currency-row:not(.dragging)'));
        rowsAfter.forEach(row => {
            const oldTop = first.get(row);
            if (oldTop === undefined) return;

            const newTop = row.getBoundingClientRect().top;
            const delta = oldTop - newTop;
            if (!delta) return;

            row.style.transition = 'none';
            row.style.transform = `translateY(${delta}px)`;
            row.offsetHeight;

            requestAnimationFrame(() => {
                row.style.transition = 'transform 0.18s ease';
                row.style.transform = '';
            });
        });
    }

    function onStart(row, clientY) {
        draggedRow = row;
        const rect = row.getBoundingClientRect();
        startY = clientY;
        lastClientY = clientY;
        startTop = rect.top;

        placeholder = document.createElement('div');
        placeholder.className = 'drag-placeholder';
        placeholder.style.height = rect.height + 'px';
        placeholder.style.background = 'transparent';

        row.classList.add('dragging');
        row.style.position = 'fixed';
        row.style.left = rect.left + 'px';
        row.style.top = rect.top + 'px';
        row.style.width = rect.width + 'px';
        row.style.pointerEvents = 'none';
        row.parentNode.insertBefore(placeholder, row);
    }

    function moveDraggedRow() {
        moveFrame = null;
        if (!draggedRow) return;
        const newTop = startTop + (lastClientY - startY);
        draggedRow.style.top = newTop + 'px';
    }

    function movePlaceholder(clientY) {
        const rows = Array.from(list.querySelectorAll('.currency-row:not(.dragging)'));
        for (const r of rows) {
            const rect = r.getBoundingClientRect();
            const mid = rect.top + rect.height / 2;
            if (clientY < mid) {
                if (placeholder.nextSibling !== r) {
                    animateRows(() => list.insertBefore(placeholder, r));
                }
                return;
            }
        }

        if (placeholder.nextSibling !== null) {
            animateRows(() => list.appendChild(placeholder));
        }
    }

    function onMove(clientY) {
        if (!draggedRow) return;
        lastClientY = clientY;

        if (!moveFrame) {
            moveFrame = requestAnimationFrame(moveDraggedRow);
        }

        movePlaceholder(clientY);
    }

    function onEnd() {
        if (!draggedRow) return;

        if (moveFrame) {
            cancelAnimationFrame(moveFrame);
            moveFrame = null;
        }

        list.insertBefore(draggedRow, placeholder);
        placeholder.remove();
        placeholder = null;

        draggedRow.classList.remove('dragging');
        draggedRow.style.position = '';
        draggedRow.style.left = '';
        draggedRow.style.top = '';
        draggedRow.style.width = '';
        draggedRow.style.pointerEvents = '';

        const newOrder = Array.from(list.querySelectorAll('.currency-row'))
            .map(r => r.dataset.code);
        selected = newOrder;
        saveState();
        draggedRow = null;
    }

    list.querySelectorAll('.drag-handle').forEach(handle => {
        handle.addEventListener('touchstart', (e) => {
            e.preventDefault();
            onStart(handle.closest('.currency-row'), e.touches[0].clientY);
        }, { passive: false });
        handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            onStart(handle.closest('.currency-row'), e.clientY);
            const mm = (ev) => onMove(ev.clientY);
            const mu = () => {
                onEnd();
                document.removeEventListener('mousemove', mm);
                document.removeEventListener('mouseup', mu);
            };
            document.addEventListener('mousemove', mm);
            document.addEventListener('mouseup', mu);
        });
    });
    document.addEventListener('touchmove', (e) => {
        if (draggedRow) { e.preventDefault(); onMove(e.touches[0].clientY); }
    }, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
}

function renderModalList(query) {
    modalList.innerHTML = '';
    const q = query.trim().toLowerCase();

    const allCodes = Object.keys(rates).filter(c => CURRENCY_META[c]).sort();

    const filtered = allCodes.filter(code => {
        const meta = CURRENCY_META[code];
        const name = (meta && meta.name) ? meta.name.toLowerCase() : '';
        return code.toLowerCase().includes(q) || name.includes(q);
    });

    if (!filtered.length) {
        modalList.innerHTML = '<div class="empty">Ничего не найдено</div>';
        return;
    }

    filtered.forEach(code => {
        const meta = CURRENCY_META[code] || { country: 'un', name: code };
        const isSelected = selected.includes(code);
        const row = document.createElement('div');
        row.className = 'modal-row' + (isSelected ? ' disabled' : '');
        const rateInfo = code === 'RUB' ? '1 ₽' : `${formatAmount(rates[code])} ₽`;
        row.innerHTML = `
            <img class="flag-img" src="${flagUrl(meta.country)}" alt="${code}" loading="lazy" onerror="this.style.visibility='hidden'">
            <div class="modal-row-info">
                <div class="modal-row-code">${code}</div>
                <div class="modal-row-name">${meta.name}</div>
            </div>
            <div class="modal-row-rate">${rateInfo}</div>
            ${isSelected ? '<div class="check">✓</div>' : ''}
        `;
        if (!isSelected) {
            row.addEventListener('click', () => {
                selected.push(code);
                if (!activeCode) activeCode = code;
                saveState();
                renderList();
                closeModal();
            });
        }
        modalList.appendChild(row);
    });
}

    document.querySelector('.actions-row').classList.toggle('editing', on);

});

async function init() {
    applyFallbackRates();
    loadState();
    loadCache();
    applyFallbackRates();

    if (!Array.isArray(selected) || selected.length === 0) {
        selected = [...DEFAULT_SELECTED];
        activeCode = 'USD';
        activeAmount = 100;
    }

    if (!activeCode || !rates[activeCode]) {
        activeCode = selected[0] || 'RUB';
    }

    renderList();

    await fetchRates(false);
    renderList();
}

setInterval(() => fetchRates(false).then(() => renderList()), ONE_HOUR);

init();
</script>
