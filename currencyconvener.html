    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-color: #333;
            --text-muted: #888;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --button-bg: #007bff;
            --button-text: #fff;
            --row-hover: #f5f9ff;
            --active-bg: #e7f1ff;
            --active-border: #007bff;
            --divider: #eef0f3;
            --shadow: rgba(0, 60, 150, 0.08);
            --dragging-bg: #e7f1ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; }
        html { scroll-behavior: smooth; }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 0;
            transition: min-height 0.25s ease;
        }

        .main-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            width: 100%;
        }

        .calculator {
            transition: none;
        }
        body.editing .calculator {
            transform: none;
        }

        footer {
            text-align: center;
            padding: 20px 10px 10px;
            color: gray;
            font-size: 14px;
            font-family: Arial, sans-serif;
            width: 100%;
        }

        .calculator {
            background: var(--input-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h2 {
            margin-bottom: 6px;
            color: var(--text-color);
            text-align: center;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        button {
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .actions-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .actions-row .add-btn,
        .actions-row .status-btn {
            flex: 1;
        }

        .status-btn {
            background: var(--input-bg);
            color: var(--text-muted);
            border: 1px solid var(--input-border);
            border-radius: 5px;
            font-weight: normal;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-btn:hover {
            background: var(--row-hover);
            border-color: var(--button-bg);
            color: var(--text-color);
        }
        .status-btn .refresh-icon {
            flex-shrink: 0;
            display: block;
            transition: transform 0.2s;
        }
        .status-btn:active .refresh-icon { transform: scale(0.9); }
        .status-btn.spinning .refresh-icon { animation: spin 0.8s linear infinite; }
        .status-btn .status-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .source-note {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.25s ease, opacity 0.2s ease;
        }
        .source-note > span { display: block; padding: 8px 4px 0; }
        .source-note.has-message { max-height: 240px; opacity: 1; }
        .offline-note {
            font-size: 11px;
            line-height: 1.5;
            color: var(--text-muted);
            text-align: center;
            overflow-wrap: anywhere;
        }
        .install-app-btn {
            background: var(--input-bg);
            color: var(--button-bg);
            border: 1px solid var(--button-bg);
            font-size: 14px;
            padding: 10px 12px;
        }
        .install-app-btn:hover { background: var(--row-hover); }
        .install-app-btn[hidden], .install-help[hidden] { display: none !important; }
        .install-help {
            font-size: 11px;
            line-height: 1.5;
            color: var(--text-muted);
            text-align: center;
        }
        @media (display-mode: standalone) {
            .install-app-btn, .install-help { display: none !important; }
        }
        .source-note { line-height: 1.5; }
        .status-btn:disabled { cursor: wait; }

        .note-sep {
            display: inline-block;
            width: 1px;
            height: 9px;
            margin: 0 8px;
            vertical-align: middle;
            background: var(--input-border);
        }
        .actions-row.editing ~ .source-note,
        body.editing .source-note {
            max-height: 240px;
            opacity: 1;
        }

        .add-btn {
            background: var(--input-bg);
            color: var(--button-bg);
            border: 1px dashed var(--button-bg);
            font-weight: normal;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .add-btn:hover { background: var(--row-hover); }

        .actions-row.editing .status-btn { display: none; }
        .actions-row.editing .add-btn { display: inline-flex; }

        .edit-btn {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--button-bg);
            border-radius: 5px;
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
        }

        .edit-btn:hover {
            background: var(--row-hover);
            border-color: var(--button-bg);
        }

        .edit-btn.active {
            background: var(--button-bg);
            border-color: var(--button-bg);
            color: var(--button-text);
        }

        .edit-btn svg {
            display: block;
            transition: transform 0.2s;
        }
        .edit-btn:active svg {
            transform: scale(0.9);
        }
        .edit-btn .icon-check { display: none; }
        .edit-btn.active .icon-pencil { display: none; }
        .edit-btn.active .icon-check { display: block; }

        .currency-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .currency-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            background: var(--input-bg);
            text-align: left;
            transition: box-shadow 0.15s, transform 0.15s;
        }
        .currency-row.active {
            background: var(--active-bg);
            border-color: var(--active-border);
        }
        .currency-row.dragging {
            background: var(--dragging-bg);
            box-shadow: 0 6px 20px var(--shadow);
            z-index: 10;
            border-color: var(--button-bg);
        }

        .drag-handle {
            color: var(--text-muted);
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            font-size: 18px;
            padding: 4px 2px;
            flex-shrink: 0;
            line-height: 1;
            touch-action: none;
            display: none;
        }
        .drag-handle:active { cursor: grabbing; }

        .flag-img {
            width: 32px;
            height: 24px;
            border-radius: 3px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--divider);
        }

        .flag-img[alt="CHF"] {
            width: 32px;
            height: 32px;
            object-fit: cover;
            background: transparent;
        }

        .currency-info { flex: 1; min-width: 0; }
        .currency-code {
            font-weight: bold;
            font-size: 14px;
            color: var(--text-color);
        }
        .currency-name {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .amount-input {
            width: 120px;
            flex: 0 0 120px;
            min-width: 120px;
            padding: 8px;
            text-align: right;
            font-size: 16px;
            font-weight: bold;
            transition: width 0.18s ease, flex-basis 0.18s ease;
        }
        .amount-input.is-wide {
            width: 175px;
            flex-basis: 175px;
            min-width: 175px;
        }
        .amount-input:focus {
            outline: none;
            border-color: var(--button-bg);
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            width: auto;
            padding: 4px 6px;
            display: none;
        }
        .remove-btn:hover { background: none; color: #dc3545; }

        .currency-list.is-editing .drag-handle,
        .currency-list.is-editing .remove-btn {
            display: block;
        }

        .modal-bg {
            position: fixed; inset: 0;
            background: rgba(0, 30, 80, 0.5);
            z-index: 100;
            display: none;
            justify-content: center; align-items: center;
            padding: 10px;
        }
        .modal-bg.open { display: flex; }
        .modal {
            background: var(--input-bg);
            border-radius: 10px;
            width: 100%; max-width: 400px;
            max-height: 90vh; max-height: 90dvh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            padding: 15px;
            border-bottom: 1px solid var(--divider);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { font-size: 16px; color: var(--button-bg); }
        .modal-close {
            background: none; border: none;
            font-size: 22px; color: var(--text-muted);
            cursor: pointer; width: auto;
            padding: 0 6px; line-height: 1;
        }
        .search-wrap {
            padding: 10px 15px;
            border-bottom: 1px solid var(--divider);
        }
        .search-wrap input { font-size: 14px; padding: 10px; cursor: pointer; }

        .modal-list {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex: 1;
        }
        .modal-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            border-bottom: 1px solid var(--divider);
            cursor: pointer;
        }
        .modal-row:hover { background: var(--row-hover); }
        .modal-row.disabled { opacity: 0.4; pointer-events: none; }
        .modal-row-info { flex: 1; min-width: 0; }
        .modal-row-code { font-weight: bold; font-size: 14px; color: var(--text-color); }
        .modal-row-name { font-size: 12px; color: var(--text-muted); }
        .modal-row-rate {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
        }
        .check {
            color: var(--button-bg);
            font-weight: bold;
            font-size: 16px;
        }
        .empty {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }



        .side-back-zone {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: calc((100vw - 400px) / 2);
            display: none;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            z-index: 10;
        }

        .side-back-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: gray;
            opacity: 0.45;
            transform: translate(-50%, -50%);
            transition: opacity 0.2s, transform 0.2s, background-color 0.2s;
        }

        .side-back-arrow svg {
            width: 24px;
            height: 24px;
            display: block;
            flex: 0 0 auto;
        }

        .side-back-zone:hover .side-back-arrow {
            opacity: 0.85;
            transform: translate(-50%, -50%) translateX(-4px);
            background-color: rgba(128, 128, 128, 0.10);
        }

        @media (min-width: 769px) {
            .side-back-zone {
                display: block;
            }
        }

        @media (max-width: 768px) {
            input, select, button { font-size: 14px; padding: 10px; }
            .amount-input {
                font-size: 15px;
                width: 110px;
                flex-basis: 110px;
                min-width: 110px;
                padding: 8px;
            }
            .amount-input.is-wide {
                width: 155px;
                flex-basis: 155px;
                min-width: 155px;
            }
            .edit-btn { width: 40px; height: 40px; }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1e1e1e;
                --text-color: #f4f4f9;
                --text-muted: #999;
                --input-bg: #333;
                --input-border: #555;
                --button-bg: #4a9eff;
                --button-text: #fff;
                --row-hover: #333;
                --active-bg: #1a3a5c;
                --active-border: #4a9eff;
                --divider: #444;
                --shadow: rgba(0, 0, 0, 0.4);
                --dragging-bg: #1a3a5c;
            }
            .add-btn:hover { background: #333; }
        }
    </style>
</head>

    XRP: { country: 'crypto-xrp', name: 'XRP (Ripple)' },
    DOGE: { country: 'crypto-doge', name: 'Dogecoin' },
    TON: { country: 'crypto-ton', name: 'Toncoin' }
};

function flagUrl(country) {
    if (country === 'metal-gold')      return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 24"><rect width="32" height="24" fill="#d4af37"/><text x="16" y="17" font-family="Arial" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Au</text></svg>');
    if (country === 'metal-silver')    return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 24"><rect width="32" height="24" fill="#c0c0c0"/><text x="16" y="17" font-family="Arial" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Ag</text></svg>');
    if (country === 'metal-platinum')  return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 24"><rect width="32" height="24" fill="#e5e4e2"/><text x="16" y="17" font-family="Arial" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">Pt</text></svg>');
    if (country === 'metal-palladium') return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 24"><rect width="32" height="24" fill="#ced0d4"/><text x="16" y="17" font-family="Arial" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">Pd</text></svg>');
    const CRYPTO = {
        'crypto-btc':  ['#f7931a','₿','#fff',15], 'crypto-eth':  ['#627eea','Ξ','#fff',15],
        'crypto-usdt': ['#26a17b','₮','#fff',15], 'crypto-bnb':  ['#f3ba2f','BNB','#000',9],
        'crypto-sol':  ['#9945ff','SOL','#fff',9], 'crypto-xrp':  ['#23292f','XRP','#fff',9],
        'crypto-doge': ['#c2a633','Ð','#fff',15], 'crypto-ton':  ['#0098ea','TON','#fff',9]
    };
    if (CRYPTO[country]) {
        const c = CRYPTO[country];
        return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 24"><rect width="32" height="24" fill="' + c[0] + '"/><text x="16" y="17" font-family="Arial" font-size="' + c[3] + '" font-weight="bold" fill="' + c[2] + '" text-anchor="middle">' + c[1] + '</text></svg>');
    }
    return `flags/${country}.png`;
}

let rates = { RUB: 1 };
let rateDetails = {};
let refreshPromise = null;
let lastRefreshFailed = false;
let cacheWriteFailed = false;
let offlineReady = false;
let deferredInstallPrompt = null;
let lastFetchTime = 0;
let selected = [];
let activeCode = null;
let activeAmount = 1;

const STORAGE_KEY = 'cbrConverter_v6';
// v6 could contain approximate built-in rates. Save verified rates separately.
const CACHE_KEY = 'cbrConverter_cache_v7';
const ONE_HOUR = 60 * 60 * 1000;
const NETWORK_TIMEOUT = 6000;

function validRate(value) {
    return typeof value === 'number' && Number.isFinite(value) && value > 0;
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            selected, activeCode, activeAmount
        }));
    } catch (e) {}
}

function loadState() {
    try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (Array.isArray(s.selected) && s.selected.length) selected = s.selected;
        if (s.activeCode) activeCode = s.activeCode;
        if (typeof s.activeAmount === 'number') activeAmount = s.activeAmount;

        const migrate = (code) => {
            if (code === 'XAU_G') return 'XAU';
            if (code === 'XAG_G') return 'XAG';
            if (code === 'XPT_G') return 'XPT';
            if (code === 'XPD_G') return 'XPD';
            return code;
        };
        selected = selected.map(migrate);
        if (activeCode) activeCode = migrate(activeCode);
    } catch (e) {}
}

function saveCache() {
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
            rates, details: rateDetails, fetchedAt: lastFetchTime
        }));
        cacheWriteFailed = false;
    } catch (e) {
        cacheWriteFailed = true;
    }
}

function loadCache() {
    try {
        const c = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
        if (!c || !c.rates || !c.details || !validRate(c.fetchedAt)) return false;
        const restored = { RUB: 1 };
        const details = {};
        for (const code of Object.keys(CURRENCY_META)) {
            const detail = c.details[code];
            if (code !== 'RUB' && validRate(c.rates[code]) && detail && validRate(detail.fetchedAt)) {
                restored[code] = c.rates[code];
                details[code] = {
                    fetchedAt: detail.fetchedAt,
                    date: typeof detail.date === 'string' ? detail.date : null,
                    source: typeof detail.source === 'string' ? detail.source : ''
                };
            }
        }
        if (!Object.keys(details).length) return false;
        rates = restored;
        rateDetails = details;
        lastFetchTime = c.fetchedAt;
        return true;
    } catch (e) {
        return false;
    }
}

async function fetchJSON(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), NETWORK_TIMEOUT);
    try {
        const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return await response.json();
    } finally {
        clearTimeout(timer);
    }
}

function sourceDate(value) {
    if (!value) return null;
    const date = new Date(value);
    return Number.isFinite(date.getTime()) ? date.toISOString().slice(0, 10) : null;
}

async function fetchFromJsDelivr(now) {
    const urls = [
        `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/rub.json?_=${now}`,
        `https://latest.currency-api.pages.dev/v1/currencies/rub.json?_=${now}`
    ];
    const METAL_CODES = ['XAU', 'XAG', 'XPT', 'XPD'];
    const OZ_TO_G = 31.1035;
    for (const url of urls) {
        try {
            const data = await fetchJSON(url);
            if (!data || !data.rub) continue;
            const result = {};
            for (const code of Object.keys(CURRENCY_META)) {
                const value = data.rub[code.toLowerCase()];
                if (validRate(value) && validRate(1 / value)) result[code] = 1 / value;
            }
            for (const metal of METAL_CODES) {
                const value = data.rub[metal.toLowerCase()];
                if (validRate(value) && validRate(1 / value)) {
                    result[metal] = (1 / value) / OZ_TO_G;
                    result[metal + '_U'] = 1 / value;
                }
            }
            if (Object.keys(result).some(code => code !== 'RUB')) {
                return { rates: result, date: sourceDate(data.date), source: 'Currency API' };
            }
        } catch (e) {}
    }
    return null;
}

async function fetchFromCBR(now) {
    try {
        const data = await fetchJSON('https://www.cbr-xml-daily.ru/daily_json.js?_=' + now);
        if (!data || !data.Valute) return null;
        const result = {};
        for (const code of Object.keys(data.Valute)) {
            const value = data.Valute[code];
            if (Object.hasOwn(CURRENCY_META, code) && value && validRate(value.Value) && validRate(value.Nominal)) {
                const rate = value.Value / value.Nominal;
                if (validRate(rate)) result[code] = rate;
            }
        }
        return Object.keys(result).some(code => code !== 'RUB')
            ? { rates: result, date: sourceDate(data.Date), source: 'ЦБ РФ' } : null;
    } catch (e) {
        return null;
    }
}

const CG_IDS = {
    BTC: 'bitcoin', ETH: 'ethereum', USDT: 'tether', BNB: 'binancecoin',
    SOL: 'solana', XRP: 'ripple', DOGE: 'dogecoin', TON: 'the-open-network'
};

async function fetchCryptoFromCoinGecko() {
    const ids = Object.values(CG_IDS).join(',');
    try {
        const data = await fetchJSON(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=rub`);
        if (!data) return null;
        const result = {};
        for (const code of Object.keys(CG_IDS)) {
            const value = data[CG_IDS[code]];
            if (value && validRate(value.rub)) result[code] = value.rub;
        }
        return Object.keys(result).length
            ? { rates: result, date: null, source: 'CoinGecko' } : null;
    } catch (e) {
        return null;
    }
}

async function fetchRates(force = false) {
    if (navigator.onLine === false) {
        updateStatus();
        return false;
    }
    if (refreshPromise) return refreshPromise;
    if (!force && lastFetchTime && Date.now() - lastFetchTime < ONE_HOUR && !lastRefreshFailed) {
        updateStatus();
        return true;
    }
    const button = document.getElementById('refreshBtn');
    button.classList.add('spinning');
    button.disabled = true;
    document.getElementById('statusText').textContent = 'Обновление курсов…';
    refreshPromise = (async () => {
        const now = Date.now();
        const [cbr, currencyAPI, crypto] = await Promise.all([
            fetchFromCBR(now), fetchFromJsDelivr(now), fetchCryptoFromCoinGecko()
        ]);
        // Merge successful sources. Keep every previously saved rate when a source fails.
        // CBR takes priority for fiat; CoinGecko takes priority for cryptocurrency.
        let anyOk = false;
        const receivedAt = Date.now();
        for (const result of [currencyAPI, cbr, crypto]) {
            if (!result) continue;
            for (const [code, value] of Object.entries(result.rates)) {
                if (code === 'RUB' || !Object.hasOwn(CURRENCY_META, code) || !validRate(value)) continue;
                rates[code] = value;
                rateDetails[code] = {
                    fetchedAt: receivedAt, date: result.date, source: result.source
                };
                anyOk = true;
            }
        }
        lastRefreshFailed = !anyOk;
        if (anyOk) {
            lastFetchTime = receivedAt;
            saveCache();
        }
        refreshAmounts();
        return anyOk;
    })();
    try {
        return await refreshPromise;
    } finally {
        refreshPromise = null;
        button.classList.remove('spinning');
        button.disabled = false;
        updateStatus();
    }
}

function formatSavedAt(timestamp) {
    return new Date(timestamp).toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
}

function updateOfflineNote() {
    if (!offlineReady) return;
    document.getElementById('offlineNote').textContent = cacheWriteFailed
        ? 'Страница сохранена, но новые курсы сохранить не удалось. Проверьте свободное место на устройстве.'
        : lastFetchTime
            ? 'Доступно без интернета на этом устройстве.'
            : 'Страница сохранена. Для расчётов сначала загрузите курсы с интернетом.';
}

function updateStatus() {
    const offline = navigator.onLine === false;
    const stamp = lastFetchTime ? formatSavedAt(lastFetchTime) : '';
    const status = document.getElementById('statusText');
    status.textContent = !lastFetchTime
        ? (offline ? 'Офлайн · нет сохранённых курсов' : 'Курсы пока не загружены')
        : `${offline ? 'Офлайн' : lastRefreshFailed ? 'Сохранено' : 'Обновлено'} · ${stamp}`;
    document.getElementById('refreshBtn').title = status.textContent + '. Обновить курсы';

    const messages = [];
    const codes = [...new Set([...selected, activeCode])].filter(code => code && code !== 'RUB');
    const missing = codes.filter(code => !validRate(rates[code]));
    const older = codes.filter(code => rateDetails[code] && rateDetails[code].fetchedAt < lastFetchTime);
    if (offline && lastFetchTime) messages.push('Без интернета расчёт выполняется по сохранённым курсам.');
    if (lastRefreshFailed && !offline) messages.push('Сервисы курсов недоступны. Показаны последние сохранённые данные.');
    if (!lastFetchTime) messages.push('Подключитесь к интернету и нажмите обновление курсов.');
    else if (missing.length) messages.push(`Нет сохранённого курса: ${missing.join(', ')}.`);
    if (older.length) messages.push(`Ранее сохранённые курсы: ${older.join(', ')}.`);
    const note = document.getElementById('sourceNote');
    note.classList.toggle('has-message', messages.length > 0);
    const dates = [...new Set(codes.map(code => rateDetails[code]?.date).filter(Boolean))].sort();
    const sources = [...new Set(codes.map(code => rateDetails[code]?.source).filter(Boolean))];
    if (dates.length) {
        const first = dates[0].split('-').reverse().join('.');
        const last = dates[dates.length - 1].split('-').reverse().join('.');
        messages.push(`Дата курсов: ${first === last ? first : first + ' — ' + last}.`);
    }
    if (sources.length) messages.push(`Источники: ${sources.join(', ')}.`);
    document.getElementById('sourceNoteText').textContent = messages.join(' ');
    updateOfflineNote();
}

function rateDescription(code) {
    if (code === 'RUB') return 'Российский рубль';
    const detail = rateDetails[code];
    if (!detail) return 'Нет сохранённого курса. Для загрузки нужен интернет.';
    return `${detail.source}. Сохранено ${formatSavedAt(detail.fetchedAt)}`
        + (detail.date ? `. Курс на ${detail.date.split('-').reverse().join('.')}` : '');
}

function refreshAmounts() {
    document.querySelectorAll('.amount-input').forEach(input => {
        if (input !== document.activeElement) {
            input.value = formatAmount(input.dataset.code === activeCode
                ? activeAmount : convert(activeAmount, activeCode, input.dataset.code));
            updateAmountInputWidth(input);
        }
    });
    document.querySelectorAll('.currency-row').forEach(row => {
        row.querySelector('.currency-name').title = rateDescription(row.dataset.code);
    });
    if (document.getElementById('modal').classList.contains('open')) renderModalList(searchBox.value);
}

async function prepareOffline() {
    const note = document.getElementById('offlineNote');
    if (!('serviceWorker' in navigator) || !window.isSecureContext) {
        note.textContent = 'Для офлайн-режима откройте конвертер на сайте в современном браузере.';
        return;
    }
    try {
        const registration = await navigator.serviceWorker.register('./currency-sw.js', {
            scope: './currencyconvener.html', updateViaCache: 'none'
        });
        if (registration.active?.state !== 'activated') {
            const worker = registration.installing || registration.waiting || registration.active;
            if (!worker) throw new Error('No service worker');
            await new Promise((resolve, reject) => {
                const changed = () => {
                    if (worker.state !== 'activated' && worker.state !== 'redundant') return;
                    worker.removeEventListener('statechange', changed);
                    if (worker.state === 'activated') resolve();
                    else reject(new Error('Offline installation failed'));
                };
                worker.addEventListener('statechange', changed);
                changed();
            });
        }
        offlineReady = true;
        updateOfflineNote();
        updateInstallButton();
    } catch (error) {
        note.textContent = 'Не удалось сохранить страницу для офлайн-режима. Откройте её ещё раз с интернетом.';
        console.warn('Не удалось подготовить конвертер для работы офлайн:', error);
    }
}

function isStandaloneMode() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
}

function updateInstallButton() {
    const button = document.getElementById('installAppBtn');
    const help = document.getElementById('installHelp');
    if (isStandaloneMode()) {
        button.hidden = true;
        help.hidden = true;
        return;
    }
    button.hidden = !offlineReady;
}

window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    updateInstallButton();
});

window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    document.getElementById('installAppBtn').hidden = true;
    document.getElementById('installHelp').hidden = true;
});

document.getElementById('installAppBtn').addEventListener('click', async () => {
    const button = document.getElementById('installAppBtn');
    const help = document.getElementById('installHelp');
    if (deferredInstallPrompt) {
        const promptEvent = deferredInstallPrompt;
        deferredInstallPrompt = null;
        await promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        if (choice && choice.outcome === 'accepted') {
            button.hidden = true;
            help.hidden = true;
            return;
        }
    }
    help.textContent = 'В Samsung Internet откройте меню ≡ и выберите «Добавить страницу в» → «Главный экран». В Chrome нажмите ⋮ → «Установить приложение».';
    help.hidden = false;
});

document.getElementById('refreshBtn').addEventListener('click', () => fetchRates(true));
window.addEventListener('offline', updateStatus);
window.addEventListener('online', () => fetchRates(true));
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) fetchRates(false);
});

function convert(amount, fromCode, toCode) {
    if (!validRate(rates[fromCode]) || !validRate(rates[toCode])) return null;
    const inRub = amount * rates[fromCode];
    return inRub / rates[toCode];
}

function formatAmount(n) {
    if (!Number.isFinite(n)) return '—';
    const abs = Math.abs(n);
    let decimals = 2;
    if (abs >= 10000) decimals = 0;
    else if (abs >= 1) decimals = 2;
    else if (abs >= 0.01) decimals = 4;
    else decimals = 6;

    const rounded = Math.round(n * Math.pow(10, decimals)) / Math.pow(10, decimals);
    if (rounded === Math.trunc(rounded)) {
        decimals = 0;
    }

    return n.toLocaleString('ru-RU', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
    });
}

function updateAmountInputWidth(input) {
    if (!input) return;

    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    const compactWidth = isMobile ? 110 : 120;
    const wideWidth = isMobile ? 155 : 175;

    // Для мобильных браузеров не измеряем текст через canvas:
    // при 10 цифрах (1 000 000 000) обычного поля уже недостаточно.
    const value = String(input.value || '').trim();
    const integerPart = value.split(/[.,]/)[0];
    const digitCount = (integerPart.match(/\d/g) || []).length;
    const shouldBeWide = digitCount >= 10;
    const targetWidth = shouldBeWide ? wideWidth : compactWidth;

    input.classList.toggle('is-wide', shouldBeWide);

    // Задаём ширину непосредственно элементу. Это не даёт flex/mobile-браузеру
    // сжать активное поле обратно до компактного размера.
    input.style.setProperty('width', targetWidth + 'px', 'important');
    input.style.setProperty('flex-basis', targetWidth + 'px', 'important');
    input.style.setProperty('min-width', targetWidth + 'px', 'important');
    input.style.setProperty('max-width', targetWidth + 'px', 'important');
    input.style.setProperty('flex-shrink', '0', 'important');
}

function renderList() {
    updateStatus();
    const list = document.getElementById('currencyList');
    list.innerHTML = '';

    selected.forEach(code => {
        const meta = CURRENCY_META[code] || { country: 'un', name: code };
        const row = document.createElement('div');
        row.className = 'currency-row' + (code === activeCode ? ' active' : '');
        row.dataset.code = code;

        const value = (code === activeCode)
            ? activeAmount
            : convert(activeAmount, activeCode, code);

        row.innerHTML = `
            <span class="drag-handle">≡</span>
            <img class="flag-img" src="${flagUrl(meta.country)}" alt="${code}" loading="lazy" onerror="this.style.visibility='hidden'">
            <div class="currency-info">
                <div class="currency-code">${code}</div>
                <div class="currency-name">${meta.name}</div>
            </div>
            <input type="text" inputmode="decimal" enterkeyhint="done" class="amount-input"
                   value="${formatAmount(value)}" data-code="${code}">
            <button class="remove-btn" data-remove="${code}" title="Убрать">✕</button>
        `;
        row.querySelector('.currency-name').title = rateDescription(code);
        list.appendChild(row);
    });

    list.querySelectorAll('.amount-input').forEach(inp => {
        const initialRaw = inp.value.replace(/\s/g, '').replace(',', '.');
        updateAmountInputWidth(inp, parseFloat(initialRaw));

        inp.addEventListener('focus', (e) => {
            const code = e.target.dataset.code;
            activeCode = code;
            const raw = e.target.value.replace(/\s/g, '').replace(',', '.');
            activeAmount = parseFloat(raw) || 0;
            document.querySelectorAll('.currency-row').forEach(r => r.classList.remove('active'));
            e.target.closest('.currency-row').classList.add('active');
            e.target.value = '';
            updateAmountInputWidth(e.target);
        });
        inp.addEventListener('input', (e) => {
            const el = e.target;
            const code = el.dataset.code;

            const oldValue = el.value;
            const cursorPos = el.selectionStart;

            let raw = oldValue.replace(/[^\d.,]/g, '').replace(',', '.');
            const parts = raw.split('.');
            if (parts.length > 2) raw = parts[0] + '.' + parts.slice(1).join('');

            const spacesBeforeOld = (oldValue.slice(0, cursorPos).match(/\s/g) || []).length;
            const digitsBeforeCursor = cursorPos - spacesBeforeOld;

            const dotIdx = raw.indexOf('.');
            let intPart = dotIdx >= 0 ? raw.slice(0, dotIdx) : raw;
            const fracPart = dotIdx >= 0 ? raw.slice(dotIdx) : '';
            intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            const newValue = intPart + fracPart;

            el.value = newValue;

            let newCursor = 0;
            let digitCount = 0;
            for (let i = 0; i < newValue.length && digitCount < digitsBeforeCursor; i++) {
                if (/\d/.test(newValue[i])) digitCount++;
                newCursor = i + 1;
            }
            if (digitsBeforeCursor === 0) newCursor = 0;
            try { el.setSelectionRange(newCursor, newCursor); } catch (err) {}

            const num = parseFloat(raw);
            if (!isNaN(num)) {
                activeCode = code;
                activeAmount = num;
                updateAmountInputWidth(el);
                document.querySelectorAll('.amount-input').forEach(other => {
                    if (other.dataset.code !== code) {
                        const v = convert(num, code, other.dataset.code);
                        other.value = formatAmount(v);
                        updateAmountInputWidth(other);
                    }
                });
                saveState();
            } else {
                updateAmountInputWidth(el);
            }
        });
        inp.addEventListener('blur', (e) => {
            const raw = e.target.value.replace(/\s/g, '').replace(',', '.');
            if (raw === '') {
                const code = e.target.dataset.code;
                const v = (code === activeCode) ? activeAmount : convert(activeAmount, activeCode, code);
                e.target.value = formatAmount(v);
                updateAmountInputWidth(e.target);
                return;
            }
            const num = parseFloat(raw) || 0;
            e.target.value = formatAmount(num);
            updateAmountInputWidth(e.target);
        });
        inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === 'Tab' || e.keyCode === 13 || e.keyCode === 9) {
                e.preventDefault();
                e.target.blur();
            }
        });
    });

    list.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const code = e.currentTarget.dataset.remove;
            selected = selected.filter(c => c !== code);
            if (activeCode === code) {
                activeCode = selected[0] || null;
                activeAmount = 1;
            }
            saveState();
            renderList();
        });
    });

    setupDragAndDrop();
}

function setupDragAndDrop() {
    const list = document.getElementById('currencyList');
    let draggedRow = null;
    let startY = 0;
    let startTop = 0;
    let placeholder = null;
    let lastClientY = 0;
    let moveFrame = null;

    function animateRows(changeDom) {
        const rowsBefore = Array.from(list.querySelectorAll('.currency-row:not(.dragging)'));
        const first = new Map(rowsBefore.map(row => [row, row.getBoundingClientRect().top]));

        changeDom();

        const rowsAfter = Array.from(list.querySelectorAll('.currency-row:not(.dragging)'));
        rowsAfter.forEach(row => {
            const oldTop = first.get(row);
            if (oldTop === undefined) return;

            const newTop = row.getBoundingClientRect().top;
            const delta = oldTop - newTop;
            if (!delta) return;

            row.style.transition = 'none';
            row.style.transform = `translateY(${delta}px)`;
            row.offsetHeight;

            requestAnimationFrame(() => {
                row.style.transition = 'transform 0.18s ease';
                row.style.transform = '';
            });
        });
    }

    function onStart(row, clientY) {
        draggedRow = row;
        const rect = row.getBoundingClientRect();
        startY = clientY;
        lastClientY = clientY;
        startTop = rect.top;

        placeholder = document.createElement('div');
        placeholder.className = 'drag-placeholder';
        placeholder.style.height = rect.height + 'px';
        placeholder.style.background = 'transparent';

        row.classList.add('dragging');
        row.style.position = 'fixed';
        row.style.left = rect.left + 'px';
        row.style.top = rect.top + 'px';
        row.style.width = rect.width + 'px';
        row.style.pointerEvents = 'none';
        row.parentNode.insertBefore(placeholder, row);
    }

    function moveDraggedRow() {
        moveFrame = null;
        if (!draggedRow) return;
        const newTop = startTop + (lastClientY - startY);
        draggedRow.style.top = newTop + 'px';
    }

    function movePlaceholder(clientY) {
        const rows = Array.from(list.querySelectorAll('.currency-row:not(.dragging)'));
        for (const r of rows) {
            const rect = r.getBoundingClientRect();
            const mid = rect.top + rect.height / 2;
            if (clientY < mid) {
                if (placeholder.nextSibling !== r) {
                    animateRows(() => list.insertBefore(placeholder, r));
                }
                return;
            }
        }

        if (placeholder.nextSibling !== null) {
            animateRows(() => list.appendChild(placeholder));
        }
    }

    function onMove(clientY) {
        if (!draggedRow) return;
        lastClientY = clientY;

        if (!moveFrame) {
            moveFrame = requestAnimationFrame(moveDraggedRow);
        }

        movePlaceholder(clientY);
    }

    function onEnd() {
        if (!draggedRow) return;

        if (moveFrame) {
            cancelAnimationFrame(moveFrame);
            moveFrame = null;
        }

        list.insertBefore(draggedRow, placeholder);
        placeholder.remove();
        placeholder = null;

        draggedRow.classList.remove('dragging');
        draggedRow.style.position = '';
        draggedRow.style.left = '';
        draggedRow.style.top = '';
        draggedRow.style.width = '';
        draggedRow.style.pointerEvents = '';

        const newOrder = Array.from(list.querySelectorAll('.currency-row'))
            .map(r => r.dataset.code);
        selected = newOrder;
        saveState();
        draggedRow = null;
    }

    list.querySelectorAll('.drag-handle').forEach(handle => {
        handle.addEventListener('touchstart', (e) => {
            e.preventDefault();
            onStart(handle.closest('.currency-row'), e.touches[0].clientY);
        }, { passive: false });
        handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            onStart(handle.closest('.currency-row'), e.clientY);
            const mm = (ev) => onMove(ev.clientY);
            const mu = () => {
                onEnd();
                document.removeEventListener('mousemove', mm);
                document.removeEventListener('mouseup', mu);
            };
            document.addEventListener('mousemove', mm);
            document.addEventListener('mouseup', mu);
        });
    });
    document.addEventListener('touchmove', (e) => {
        if (draggedRow) { e.preventDefault(); onMove(e.touches[0].clientY); }
    }, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
}

const modal = document.getElementById('modal');
const modalList = document.getElementById('modalList');
const searchBox = document.getElementById('searchBox');

function openModal() {
    modal.classList.add('open');
    searchBox.value = '';
    searchBox.placeholder = '🔍 Нажмите для поиска';
    searchBox.setAttribute('readonly', 'readonly');
    renderModalList('');
}
function closeModal() {
    modal.classList.remove('open');
    searchBox.blur();
    searchBox.setAttribute('readonly', 'readonly');
}
document.getElementById('addBtn').addEventListener('click', openModal);
document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

searchBox.addEventListener('click', () => {
    if (searchBox.hasAttribute('readonly')) {
        searchBox.removeAttribute('readonly');
        searchBox.placeholder = 'USD, доллар, евро…';
        searchBox.focus();
    }
});
searchBox.addEventListener('input', (e) => renderModalList(e.target.value));

function renderModalList(query) {
    modalList.innerHTML = '';
    const q = query.trim().toLowerCase();

    const allCodes = Object.keys(CURRENCY_META).sort();

    const filtered = allCodes.filter(code => {
        const meta = CURRENCY_META[code];
        const name = (meta && meta.name) ? meta.name.toLowerCase() : '';
        return code.toLowerCase().includes(q) || name.includes(q);
    });

    if (!filtered.length) {
        modalList.innerHTML = '<div class="empty">Ничего не найдено</div>';
        return;
    }

    filtered.forEach(code => {
        const meta = CURRENCY_META[code] || { country: 'un', name: code };
        const isSelected = selected.includes(code);
        const row = document.createElement('div');
        row.className = 'modal-row' + (isSelected ? ' disabled' : '');
        const rateInfo = validRate(rates[code]) ? `${formatAmount(rates[code])} ₽` : 'Нет курса';
        row.innerHTML = `
            <img class="flag-img" src="${flagUrl(meta.country)}" alt="${code}" loading="lazy" onerror="this.style.visibility='hidden'">
            <div class="modal-row-info">
                <div class="modal-row-code">${code}</div>
                <div class="modal-row-name">${meta.name}</div>
            </div>
            <div class="modal-row-rate">${rateInfo}</div>
            ${isSelected ? '<div class="check">✓</div>' : ''}
        `;
        if (!isSelected) {
            row.addEventListener('click', () => {
                selected.push(code);
                if (!activeCode) activeCode = code;
                saveState();
                renderList();
                closeModal();
            });
        }
        modalList.appendChild(row);
    });
}

const DEFAULT_SELECTED = ['USD', 'EUR', 'RUB', 'BTC', 'XAU'];

const editBtn = document.getElementById('editBtn');
editBtn.addEventListener('click', () => {
    const list = document.getElementById('currencyList');
    const on = !list.classList.contains('is-editing');
    list.classList.toggle('is-editing', on);
    editBtn.classList.toggle('active', on);
    document.querySelector('.actions-row').classList.toggle('editing', on);
    document.body.classList.toggle('editing', on);
});

async function init() {
    loadState();
    loadCache();
    selected = [...new Set(selected)].filter(code => Object.hasOwn(CURRENCY_META, code));

    if (!Array.isArray(selected) || selected.length === 0) {
        selected = [...DEFAULT_SELECTED];
        activeCode = 'USD';
        activeAmount = 100;
    }

    if (!activeCode || !rates[activeCode]) {
        activeCode = selected[0] || 'RUB';
    }

    renderList();

    prepareOffline();
    await fetchRates(false);
}

setInterval(() => fetchRates(false), ONE_HOUR);

window.addEventListener('resize', () => {
    document.querySelectorAll('.amount-input').forEach(updateAmountInputWidth);
});

init();
