<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Форекс часы</title>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">

  <link rel="manifest" href="./fxc.webmanifest">

  <link
	rel="icon"
	type="image/png"
	sizes="192x192"
	href="./images/fxc-192.png"
  >

  <link
	rel="apple-touch-icon"
	sizes="192x192"
	href="./images/fxc-192.png"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
	content="black-translucent"
  >
  <meta name="apple-mobile-web-app-title" content="Форекс часы">

  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg-page: #000000;
      --bg-glow: transparent;
      --clock-bg: #000000;
      --clock-card-bg-1: #000000;
      --clock-card-bg-2: #000000;
      --panel: rgba(255, 255, 255, 0.055);
      --panel-strong: rgba(0,0,0,0.32);
      --panel-solid: rgba(255,255,255,0.08);
      --settings-bg: #121216;
      --settings-panel: #1b1b20;
      --border: rgba(255, 255, 255, 0.1);
      --soft-border: rgba(255,255,255,0.08);
      --text: #f4f4f5;
      --text-strong: #ffffff;
      --muted: #8f8f99;
      --yellow: #e8c547;
      --green: #00d85a;
      --green-soft: rgba(0, 216, 90, 0.22);
      --green-soft-2: rgba(0, 216, 90, 0.12);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.22);
      --red-soft-2: rgba(239, 68, 68, 0.12);
      --gray-soft: rgba(122, 122, 122, 0.16);
      --gray-soft-2: rgba(122, 122, 122, 0.08);
      --grid: rgba(255,255,255,0.08);
      --tick-small: rgba(255,255,255,0.42);
      --tick-hour: rgba(255,255,255,0.5);
      --session-gray: rgba(122,122,122,0.74);
      --footer: #8f8f99;
      --shadow: rgba(0,0,0,0.35);
      --select-arrow: #f4f4f5;
      --card-transition-neutral: #101012;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg-page: #f3f4f6;
      --bg-glow: transparent;
      --clock-bg: #ffffff;
      --clock-card-bg-1: #ffffff;
      --clock-card-bg-2: #ffffff;
      --panel: rgba(255,255,255,0.82);
      --panel-strong: rgba(255,255,255,0.86);
      --panel-solid: #ffffff;
      --settings-bg: #ffffff;
      --settings-panel: #f3f4f6;
      --border: rgba(17,24,39,0.12);
      --soft-border: rgba(17,24,39,0.12);
      --text: #111827;
      --text-strong: #111827;
      --muted: #6b7280;
      --yellow: #b88a00;
      --green: #00d85a;
      --green-soft: rgba(0, 216, 90, 0.34);
      --green-soft-2: rgba(0, 216, 90, 0.18);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.32);
      --red-soft-2: rgba(239, 68, 68, 0.18);
      --gray-soft: rgba(122, 122, 122, 0.20);
      --gray-soft-2: rgba(122, 122, 122, 0.10);
      --grid: rgba(17,24,39,0.12);
      --tick-small: rgba(17,24,39,0.42);
      --tick-hour: rgba(17,24,39,0.56);
      --session-gray: rgba(122,122,122,0.74);
      --footer: #4b5563;
      --shadow: rgba(17,24,39,0.12);
      --select-arrow: #111827;
      --card-transition-neutral: #f7f7f8;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        color-scheme: light;
        --bg-page: #f3f4f6;
        --bg-glow: transparent;
        --clock-bg: #ffffff;
        --clock-card-bg-1: #ffffff;
        --clock-card-bg-2: #ffffff;
        --panel: rgba(255,255,255,0.82);
        --panel-strong: rgba(255,255,255,0.86);
        --panel-solid: #ffffff;
        --settings-bg: #ffffff;
        --settings-panel: #f3f4f6;
        --border: rgba(17,24,39,0.12);
        --soft-border: rgba(17,24,39,0.12);
        --text: #111827;
        --text-strong: #111827;
        --muted: #6b7280;
        --yellow: #b88a00;
        --green: #00d85a;
        --green-soft: rgba(0, 216, 90, 0.34);
        --green-soft-2: rgba(0, 216, 90, 0.18);
        --red: #ef4444;
        --red-soft: rgba(239, 68, 68, 0.32);
        --red-soft-2: rgba(239, 68, 68, 0.18);
        --gray-soft: rgba(122, 122, 122, 0.20);
        --gray-soft-2: rgba(122, 122, 122, 0.10);
        --grid: rgba(17,24,39,0.12);
        --tick-small: rgba(17,24,39,0.42);
        --tick-hour: rgba(17,24,39,0.56);
        --session-gray: rgba(122,122,122,0.74);
        --footer: #4b5563;
        --shadow: rgba(17,24,39,0.12);
        --select-arrow: #111827;
        --card-transition-neutral: #f7f7f8;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-page);
      color: var(--text);
      font-family: Arial, sans-serif;
      padding: 22px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .app {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
    }

    .header {
      position: relative;
      text-align: center;
      margin-bottom: 14px;
      min-height: 52px;
    }

    .header h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }

    .settings-toggle {
      position: absolute;
      top: 0;
      right: 0;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-solid);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px var(--shadow);
    }

    .settings-toggle svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .settings-toggle,
    .seg-btn,
    .tz-select,
    .tz-option {
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
    }

    .settings-toggle:focus,
    .settings-toggle:focus-visible,
    .seg-btn:focus,
    .seg-btn:focus-visible,
    .tz-select:focus,
    .tz-select:focus-visible,
    .tz-option:focus,
    .tz-option:focus-visible {
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .settings-popover {
      position: absolute;
      top: 56px;
      right: 0;
      width: min(320px, calc(100vw - 32px));
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--settings-bg) !important;
      background-image: none !important;
      box-shadow: 0 18px 44px rgba(0,0,0,0.42);
      padding: 16px;
      z-index: 1000;
      opacity: 1 !important;
      isolation: isolate;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    .settings-popover[hidden] {
      display: none !important;
    }

    .settings-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 900;
      color: var(--text);
      text-align: left;
    }

    .settings-group + .settings-group {
      margin-top: 14px;
    }

    .settings-group {
      background: var(--settings-panel) !important;
      background-image: none !important;
      border: 1px solid var(--soft-border);
      border-radius: 16px;
      padding: 12px;
      opacity: 1 !important;
    }

    .settings-label {
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
      color: var(--muted);
      text-align: left;
    }

    .segmented-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .segmented-row.three-up {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .seg-btn.small-text {
      min-height: 48px;
      padding: 8px 6px;
      font-size: 12px;
      line-height: 1.15;
      text-align: center;
      white-space: normal;
    }

    .seg-btn.theme-icon-btn {
      min-height: 48px;
      padding: 6px;
      font-size: 24px;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .seg-btn {
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #17171b;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, color .18s ease;
    }

    .seg-btn.active {
      background: #3a3215;
      border-color: #8c7627;
      color: #ffffff;
    }

    :root[data-theme="light"] .seg-btn {
      background: #ffffff;
    }

    :root[data-theme="light"] .seg-btn.active {
      background: #fff4bf;
      border-color: #b88a00;
      color: #111827;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) .seg-btn {
        background: #ffffff;
      }

      :root:not([data-theme]) .seg-btn.active {
        background: #fff4bf;
        border-color: #b88a00;
        color: #111827;
      }
    }

    .top-tools {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 16px 0 20px;
    }

    .select-wrap {
      position: relative;
      width: 100%;
      max-width: 760px;
    }

    .tz-native-select {
      display: none;
    }

    .tz-select {
      width: 100%;
      min-height: 66px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--panel-solid);
      color: var(--text);
      padding: 14px 22px 14px 24px;
      outline: none;
      font-weight: 800;
      font-size: 18px;
      line-height: 1.2;
      box-shadow: 0 10px 28px var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-align: left;
      cursor: pointer;
    }

    .tz-select-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tz-select-arrow {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      transition: transform .18s ease;
    }

    .tz-select[aria-expanded="true"] .tz-select-arrow {
      transform: rotate(180deg);
    }

    .tz-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      max-height: 330px;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--settings-bg);
      box-shadow: 0 18px 44px var(--shadow);
      z-index: 50;
      overscroll-behavior: contain;
    }

    .tz-menu[hidden] {
      display: none !important;
    }

    .tz-option {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .tz-option + .tz-option {
      margin-top: 3px;
    }

    .tz-option:hover,
    .tz-option:focus-visible {
      background: var(--settings-panel);
      outline: none;
    }

    .tz-option.active {
      background: var(--settings-panel);
      color: var(--text-strong);
    }

    .tz-option-check {
      color: var(--yellow);
      font-size: 18px;
      font-weight: 900;
      visibility: hidden;
    }

    .tz-option.active .tz-option-check {
      visibility: visible;
    }

    .clock-card {
      position: relative;
      max-width: 790px;
      margin: 0 auto 18px;
      border-radius: 0;
      background: transparent;
      border: 0;
      padding: 0;
      box-shadow: none;
    }

    .clock-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 760px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 38px;
      background: transparent;
    }

    svg { width: 100%; height: 100%; display: block; overflow: hidden; }

    .dial-bg {
      fill: var(--clock-bg);
      stroke: color-mix(in srgb, var(--text) 18%, transparent);
      stroke-width: 1;
    }

    .hour-ring {
      fill: none;
      stroke: none;
      pointer-events: none;
    }

    .grid-line { stroke: var(--grid); stroke-width: 1; }
    .small-tick { stroke: var(--tick-small); stroke-width: 1.55; opacity: 1; }

    .minute-dot {
      fill: #9a9a9a;
      opacity: 1;
    }

    .minute-dot.major {
      fill: var(--yellow);
      opacity: 0.95;
    }

    .hour-text {
      fill: var(--text);
      font-size: 31px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .minute-text {
      fill: #9a9a9a;
      opacity: 1;
      font-size: 14px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: 0.3px;
    }

    .market-session {
      fill: none;
      stroke-linecap: butt;
    }

    .market-session.open {
      stroke: rgba(0, 216, 90, 0.72);
      filter: none;
    }

    .market-session.closed {
      stroke: rgba(239, 68, 68, 0.68);
      filter: none;
    }

    .market-session.weekend {
      stroke: var(--session-gray);
      filter: none;
    }

    .live-dot {
      display: none;
    }

    .market-label {
      fill: var(--text);
      font-size: 11px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      alignment-baseline: central;
      opacity: 0.96;
      pointer-events: none;
    }

    .now-hand {
      stroke: #000000;
      stroke-width: 9;
      stroke-linecap: round;
      filter: none;
    }

    .minute-hand {
      stroke: #000000;
      stroke-width: 4;
      stroke-linecap: round;
      filter: none;
    }

    .second-hand {
      stroke: var(--red);
      stroke-width: 2;
      stroke-linecap: round;
      filter: none;
    }

    .center-dot {
      fill: var(--red);
      stroke: var(--text-strong);
      stroke-width: 4;
    }

    .center-box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 148px;
      height: 148px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 0;
      background: color-mix(in srgb, var(--clock-bg) 68%, transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
      padding: 14px;
      box-shadow: 0 16px 36px var(--shadow);
    }

    .center-title {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .center-time {
      color: #000000;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.6px;
      line-height: 1;
    }

    .center-zone {
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
      max-width: 118px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 150px;
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 18px 45px var(--shadow);
      border: 1px solid var(--border);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(145deg, rgba(255,255,255,0.07), rgba(255,255,255,0.01));
    }

    .card.open-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
      border-color: rgba(0,216,90,0.35);
    }

    .card.closed-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
      border-color: rgba(239,68,68,0.30);
    }

    /*
      Индикатор занимает всю карточку, но не меняет её исходную форму,
      тени, скругления, отступы и декоративный световой градиент.
    */
    .card-session-bg {
      --elapsed: 0%;
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: transparent;
    }

    .card-session-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at top right, rgba(255,255,255,0.08), transparent 30%);
    }

    .card-session-bg {
      --blend-half: min(5px, 1.1%);
      --blend-start: clamp(0%, calc(var(--elapsed) - var(--blend-half)), 100%);
      --blend-end: clamp(0%, calc(var(--elapsed) + var(--blend-half)), 100%);
    }

    .card-session-bg::after {
      content: none;
    }

    .card-session-left,
    .card-session-right {
      display: none;
    }

    .card-session-bg.active-weekday {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.025), rgba(0,0,0,0.025)),
        linear-gradient(
          to right,
          var(--red-soft) 0%,
          var(--red-soft-2) var(--blend-start),
          color-mix(in srgb, var(--red-soft-2) 72%, var(--green-soft-2)) var(--elapsed),
          var(--green-soft-2) var(--blend-end),
          var(--green-soft) 100%
        );
    }

    .card-session-bg.active-friday {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.025), rgba(0,0,0,0.025)),
        linear-gradient(
          to right,
          var(--gray-soft) 0%,
          var(--gray-soft-2) var(--blend-start),
          color-mix(in srgb, var(--gray-soft-2) 72%, var(--green-soft-2)) var(--elapsed),
          var(--green-soft-2) var(--blend-end),
          var(--green-soft) 100%
        );
    }

    .card-session-bg.closed-before-open,
    .card-session-bg.closed-weekday {
      background: linear-gradient(180deg, var(--red-soft), var(--red-soft-2));
    }

    .card-session-bg.weekend,
    .card-session-bg.friday-after-close {
      background: linear-gradient(180deg, var(--gray-soft), var(--gray-soft-2));
    }

    .card.weekend-card,
    .card.friday-after-close-card {
      border-color: color-mix(in srgb, var(--session-gray) 48%, transparent);
    }

    .card-time-box {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      min-width: 118px;
      text-align: right;
      padding: 9px 10px;
      border-radius: 15px;
      background: var(--panel-strong);
      border: 1px solid var(--soft-border);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .digital {
      font-size: 25px;
      font-weight: 900;
      color: var(--text-strong);
      line-height: 1;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .date-text {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
      margin-top: 5px;
      white-space: nowrap;
    }

    .card-main {
      position: relative;
      z-index: 2;
      padding-right: 140px;
    }

    .flag {
      width: 30px;
      height: 30px;
      margin-bottom: 6px;
      display: block;
      object-fit: contain;
    }
    .name { font-weight: 900; font-size: 20px; margin-bottom: 8px; }

    .trade-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .trade-time {
      display: inline-flex;
      flex-wrap: nowrap;
      gap: 4px;
      color: var(--text);
      font-size: 12px;
      line-height: 1.35;
      padding: 7px 8px;
      border-radius: 13px;
      background: color-mix(in srgb, var(--panel) 70%, transparent);
      border: 1px solid var(--soft-border);
      white-space: nowrap;
      flex: 0 0 auto;
      width: max-content;
      max-width: 100%;
    }

    .trade-time span { color: var(--muted); }

    .status-row {
      position: static;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }


    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 9px;
      border-radius: 999px;
      color: var(--yellow);
      background: rgba(232,197,71,0.12);
      border: 1px solid rgba(232,197,71,0.25);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .footer {
      text-align: center;
      padding: 15px;
      margin-top: 20px;
      background-color: transparent;
      width: 100%;
      font-family: Arial, sans-serif;
      color: gray;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0;
      box-shadow: none;
    }

    @media (max-width: 900px) {
      .cards { grid-template-columns: 1fr; }
    }

    function addOption(group, value, text, selected = false) {

    function makeUtcValue(offset) {
      if (offset === 0) return "UTC+0";
      return offset > 0 ? `UTC+${offset}` : `UTC${offset}`;
    }

    function formatUtcOffsetLabel(offsetMinutes) {
      offsetMinutes = Math.round(offsetMinutes);

      if (offsetMinutes === 0) return "UTC±0";

      const sign = offsetMinutes > 0 ? "+" : "-";
      const abs = Math.abs(offsetMinutes);
      const hours = Math.floor(abs / 60);
      const minutes = abs % 60;

      if (minutes === 0) {
        return `UTC${sign}${hours}`;
      }

      return `UTC${sign}${hours}:${pad(minutes)}`;
    }

    function buildTimezoneOptions() {
      const previousValue = clockTimezoneSelect.value || "auto";
      const t = translations[currentLang];

      clockTimezoneSelect.innerHTML = "";

      const deviceTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const deviceOffset = getOffsetMinutes(new Date(), deviceTimezone);

      const deviceCity = getLocalizedTimezoneCity(deviceTimezone, currentLang);

      addOption(
        clockTimezoneSelect,
        "auto",
        `${t.autoTimezone}: ${deviceCity} — ${formatUtcOffsetLabel(deviceOffset)} (${t.autoWord})`,
        previousValue === "auto"
      );

      for (let offset = 14; offset >= -12; offset--) {
        const value = makeUtcValue(offset);
        const text = offset === 0 ? "UTC±0" : value;
        addOption(clockTimezoneSelect, value, text, previousValue === value);
      }

      if (!clockTimezoneSelect.value) {
        clockTimezoneSelect.value = "auto";
      }

      renderTimezoneMenu();
      syncTimezoneButton();

    function isFixedUtcZone(zone) {
      return /^UTC[+-]\d{1,2}$/.test(zone);
    }

    function getFixedUtcOffsetMinutes(zone) {
      if (zone === "UTC+0") return 0;
      const match = zone.match(/^UTC([+-]\d{1,2})$/);
      return match ? Number(match[1]) * 60 : 0;
    }

    function getFixedUtcParts(date, offsetMinutes) {
      const shifted = new Date(date.getTime() + offsetMinutes * 60000);
      const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      return {
        weekday: weekdays[shifted.getUTCDay()],
        year: shifted.getUTCFullYear(),
        month: shifted.getUTCMonth() + 1,
        day: shifted.getUTCDate(),
        hour: shifted.getUTCHours(),
        minute: shifted.getUTCMinutes(),
        second: shifted.getUTCSeconds()
      };
    }

    function pad(num) { return String(num).padStart(2, "0"); }

    function locationLine(market) {
      return `${market.city[currentLang]} • ${market.country[currentLang]}`;

    function marketLabel(market) {
      return market.label[currentLang];

    function timeToMinutes(time) {
      const [h, m] = time.split(":").map(Number);
      return h * 60 + m;
    }

    function formatClockDisplay(hour, minute, second = null, includeSeconds = false) {
      if (currentHourFormat === "12") {
        const suffix = hour >= 12 ? "PM" : "AM";
        let hour12 = hour % 12;
        if (hour12 === 0) hour12 = 12;
        if (includeSeconds && second !== null) {
          return `${pad(hour12)}:${pad(minute)}:${pad(second)} ${suffix}`;
        }
        return `${pad(hour12)}:${pad(minute)} ${suffix}`;
      }

      if (includeSeconds && second !== null) {
        return `${pad(hour)}:${pad(minute)}:${pad(second)}`;
      }
      return `${pad(hour)}:${pad(minute)}`;
    }

    function minutesToTime(minutes) {
      let fixed = Math.round(minutes);
      while (fixed < 0) fixed += 1440;
      while (fixed >= 1440) fixed -= 1440;
      const h = Math.floor(fixed / 60);
      const m = fixed % 60;
      return formatClockDisplay(h, m, null, false);
    }

    function formatRawSessionTime(time) {
      const [h, m] = time.split(":").map(Number);
      return formatClockDisplay(h, m, null, false);
    }

    function minutesToAngle(minutes) {
      return (minutes / 1440) * 360;
    }

    function polarToCartesian(radius, angleDeg) {
      const angleRad = (angleDeg - 90) * Math.PI / 180;
      return { x: CX + radius * Math.cos(angleRad), y: CY + radius * Math.sin(angleRad) };
    }

    function arcPath(radius, startAngle, endAngle, sweep = 1) {
      if (sweep === 1) {
        while (endAngle < startAngle) endAngle += 360;
      } else {
        while (startAngle < endAngle) startAngle += 360;
      }

      const start = polarToCartesian(radius, startAngle);
      const end = polarToCartesian(radius, endAngle);
      const span = Math.abs(endAngle - startAngle);
      const largeArc = span <= 180 ? 0 : 1;

      return ["M", start.x, start.y, "A", radius, radius, 0, largeArc, sweep, end.x, end.y].join(" ");
    }

    function getClockTimezone() {
      if (clockTimezoneSelect.value === "auto") {
        return Intl.DateTimeFormat().resolvedOptions().timeZone;
      }
      return clockTimezoneSelect.value;
    }

    function getClockLabel() {
      if (clockTimezoneSelect.value === "auto") {
        return translations[currentLang].yourTime;
      }

      const zone = getClockTimezone();

      if (isFixedUtcZone(zone)) {
        return zone === "UTC+0" ? "UTC±0" : zone;
      }

      return getLocalizedTimezoneCity(zone, currentLang);
    }

    function getZonedParts(date, timezone) {
      if (isFixedUtcZone(timezone)) {
        return getFixedUtcParts(date, getFixedUtcOffsetMinutes(timezone));
      }

      const formatter = new Intl.DateTimeFormat("en-US", {
        timeZone: timezone,
        weekday: "short",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      });

      const parts = formatter.formatToParts(date);
      const data = {};
      parts.forEach(part => {
        if (part.type !== "literal") data[part.type] = part.value;
      });

      return {
        weekday: data.weekday,
        year: Number(data.year),
        month: Number(data.month),
        day: Number(data.day),
        hour: Number(data.hour),
        minute: Number(data.minute),
        second: Number(data.second)
      };
    }

    function getOffsetMinutes(date, timezone) {
      if (isFixedUtcZone(timezone)) {
        return getFixedUtcOffsetMinutes(timezone);
      }

      const p = getZonedParts(date, timezone);
      const asUTC = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
      return Math.round((asUTC - date.getTime()) / 60000);
    }

    function marketMinutesToClockMinutes(market, marketMinutes, now, clockTimezone) {
      const marketOffset = getOffsetMinutes(now, market.timezone);
      const clockOffset = getOffsetMinutes(now, clockTimezone);
      return marketMinutes + clockOffset - marketOffset;
    }

    function marketSessionToClockMinutes(market, session, now, clockTimezone) {
      return {
        start: marketMinutesToClockMinutes(market, timeToMinutes(session[0]), now, clockTimezone),
        end: marketMinutesToClockMinutes(market, timeToMinutes(session[1]), now, clockTimezone)
      };
    }

    function normalizeSegments(start, end) {
      const segments = [];
      while (start < 0) { start += 1440; end += 1440; }
      while (start >= 1440) { start -= 1440; end -= 1440; }

      if (end <= 1440) {
        segments.push([start, end]);
      } else {
        segments.push([start, 1440]);
        segments.push([0, end - 1440]);
      }

      return segments;
    }

    function sessionsText(sessions) {
      return sessions.map(s => `${formatRawSessionTime(s[0])}–${formatRawSessionTime(s[1])}`).join(" / ");
    }

    function sessionsInClockText(market, now) {
      const clockTimezone = getClockTimezone();
      return market.sessions.map(session => {
        const converted = marketSessionToClockMinutes(market, session, now, clockTimezone);
        return `${minutesToTime(converted.start)}–${minutesToTime(converted.end)}`;
      }).join(" / ");
    }

    function tradeTimeText(market, now) {
      return `${sessionsText(market.sessions)} <span>(${sessionsInClockText(market, now)} ${getClockLabel()})</span>`;
    }

    function formatDuration(ms) {
      let total = Math.max(0, Math.floor(ms / 1000));
      const days = Math.floor(total / 86400);
      total %= 86400;
      const h = Math.floor(total / 3600);
      total %= 3600;
      const m = Math.floor(total / 60);
      const s = total % 60;

      if (days > 0) return `${days}${translations[currentLang].dayShort} ${pad(h)}:${pad(m)}:${pad(s)}`;
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function formatMarketDate(parts) {
      if (currentLang === "en") {
        return `${pad(parts.month)}/${pad(parts.day)}/${parts.year}`;
      }

      return `${pad(parts.day)}.${pad(parts.month)}.${parts.year}`;
    }

    function isWeekend(parts) {
      const weekday = weekdayMap[parts.weekday];
      return weekday === 0 || weekday === 6;
    }

    function getState(market, date) {
      const parts = getZonedParts(date, market.timezone);
      const minutesNow = parts.hour * 60 + parts.minute + parts.second / 60;
      const weekend = isWeekend(parts);

      if (weekend) {
        return { isOpen: false, isWeekend: true, parts, activeSession: null };
      }

      for (const session of market.sessions) {
        const start = timeToMinutes(session[0]);
        const end = timeToMinutes(session[1]);
        if (minutesNow >= start && minutesNow < end) {
          return { isOpen: true, isWeekend: false, parts, activeSession: session };
        }
      }

      return { isOpen: false, isWeekend: false, parts, activeSession: null };
    }

    function getSessionProgressState(market, state) {
      const weekday = weekdayMap[state.parts.weekday];
      const minutesNow = state.parts.hour * 60 + state.parts.minute + state.parts.second / 60;

      if (state.isWeekend) {
        return { className: "weekend", elapsed: 0 };
      }

      if (state.isOpen && state.activeSession) {
        const start = timeToMinutes(state.activeSession[0]);
        const end = timeToMinutes(state.activeSession[1]);
        const duration = Math.max(1, end - start);
        const elapsed = Math.max(0, Math.min(100, ((minutesNow - start) / duration) * 100));

        return {
          className: weekday === 5 ? "active-friday" : "active-weekday",
          elapsed
        };
      }

      const starts = market.sessions.map(session => timeToMinutes(session[0]));
      const ends = market.sessions.map(session => timeToMinutes(session[1]));
      const firstStart = Math.min(...starts);
      const lastEnd = Math.max(...ends);

      if (weekday === 5 && minutesNow >= lastEnd) {
        return { className: "friday-after-close", elapsed: 100 };
      }

      if (minutesNow < firstStart) {
        return { className: "closed-before-open", elapsed: 0 };
      }

      return { className: "closed-weekday", elapsed: 100 };
    }

    function findNextChange(market, now, currentStatus) {
      let low = now.getTime();
      let high = low;

      for (let i = 0; i < 45 * 24 * 60; i++) {
        high += 60000;
        const status = getState(market, new Date(high)).isOpen;
        if (status !== currentStatus) break;
      }

      while (high - low > 1000) {
        const mid = Math.floor((low + high) / 2);
        const status = getState(market, new Date(mid)).isOpen;
        if (status === currentStatus) low = mid;
        else high = mid;
      }

      return high;
    }

    function svgLine(r1, r2, angle, className) {
      const p1 = polarToCartesian(r1, angle);
      const p2 = polarToCartesian(r2, angle);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", p1.x);
      line.setAttribute("y1", p1.y);
      line.setAttribute("x2", p2.x);
      line.setAttribute("y2", p2.y);
      line.setAttribute("class", className);
      return line;
    }

    function svgBoxLine(angle, className, halfExtent = 286) {
      const angleRad = (angle - 90) * Math.PI / 180;
      const dx = Math.cos(angleRad);
      const dy = Math.sin(angleRad);

      const tx = Math.abs(dx) < 1e-6 ? Infinity : halfExtent / Math.abs(dx);
      const ty = Math.abs(dy) < 1e-6 ? Infinity : halfExtent / Math.abs(dy);
      const t = Math.min(tx, ty);

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", CX - dx * t);
      line.setAttribute("y1", CY - dy * t);
      line.setAttribute("x2", CX + dx * t);
      line.setAttribute("y2", CY + dy * t);
      line.setAttribute("class", className);
      return line;
    }

    function svgText(radius, angle, text, className) {
      const p = polarToCartesian(radius, angle);
      const el = document.createElementNS("http://www.w3.org/2000/svg", "text");
      el.setAttribute("x", p.x);
      el.setAttribute("y", p.y);
      el.setAttribute("class", className);
      el.textContent = text;
      return el;
    }

    function svgDot(radius, angle, dotRadius, className) {
      const p = polarToCartesian(radius, angle);
      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("cx", p.x);
      dot.setAttribute("cy", p.y);
      dot.setAttribute("r", dotRadius);
      dot.setAttribute("class", className);
      return dot;
    }

    function drawBaseDial() {
      gridLayer.innerHTML = "";
      minuteDotsLayer.innerHTML = "";
      numberLayer.innerHTML = "";

      for (let i = 0; i < 96; i++) {
        const angle = i * 3.75;
        const isHour = i % 4 === 0;

        if (!isHour) {
          gridLayer.appendChild(svgLine(270, 278, angle, "small-tick"));
        }
      }

      for (let i = 0; i < 60; i++) {
        const angle = i * 6;
        const hasMinuteNumber = i % 5 === 0;

        if (!hasMinuteNumber) {
          minuteDotsLayer.appendChild(
            svgDot(224, angle, 1.55, "minute-dot")
          );
        }
      }

      for (let h = 1; h <= 24; h++) {
        const angle = minutesToAngle(h * 60);
        numberLayer.appendChild(svgText(256, angle, String(h), "hour-text"));
      }

      for (let m = 5; m <= 60; m += 5) {
        const angle = minutesToAngle(m * 24);
        numberLayer.appendChild(svgText(223, angle, String(m), "minute-text"));
      }

      for (let h = 0; h < 24; h++) {
        const angle = minutesToAngle(h * 60);
        gridLayer.appendChild(svgBoxLine(angle, "grid-line", 286));
      }
    }

    function drawArc(radius, startMinutes, endMinutes, className, strokeWidth, targetLayer) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", arcPath(radius, minutesToAngle(startMinutes), minutesToAngle(endMinutes), 1));
      path.setAttribute("class", className);
      path.setAttribute("stroke-width", strokeWidth);
      targetLayer.appendChild(path);
    }

    function drawNormalizedInterval(radius, startMinutes, endMinutes, className, strokeWidth, targetLayer) {
      if (endMinutes <= startMinutes) return;
      const segments = normalizeSegments(startMinutes, endMinutes);
      segments.forEach(segment => {
        if (segment[1] > segment[0]) {
          drawArc(radius, segment[0], segment[1], className, strokeWidth, targetLayer);
        }
      });
    }

    function createArcLabel(market, radius, segment, labelIndex, strokeWidth) {
      const label = marketLabel(market);
      const characters = Array.from(label);
      const start = segment[0];
      const end = segment[1];
      const spanMinutes = end - start;

      if (!characters.length || spanMinutes < 95) return;

      const circumference = 2 * Math.PI * radius;
      const pxPerMinute = circumference / 1440;
      const sidePaddingPx = Math.max(14, strokeWidth * 0.72);
      const availableArcPx = (spanMinutes * pxPerMinute) - (sidePaddingPx * 2);

      if (availableArcPx < 38) return;

      const canvas = createArcLabel.measureCanvas ||
        (createArcLabel.measureCanvas = document.createElement("canvas"));
      const context = canvas.getContext("2d");
      const fontFamily = "Arial, sans-serif";
      const fontWeight = 700;
      const letterGap = 0.65;

      let fontSize = 11.4;
      if (characters.length >= 8) fontSize = 10.9;
      if (characters.length >= 10) fontSize = 10.3;

      function measureAtSize(size) {
        context.font = `${fontWeight} ${size}px ${fontFamily}`;
        const widths = characters.map(character =>
          Math.max(2.5, context.measureText(character).width)
        );
        const totalWidth = widths.reduce((sum, width) => sum + width, 0) +
          Math.max(0, characters.length - 1) * letterGap;
        return { widths, totalWidth };
      }

      let metrics = measureAtSize(fontSize);
      if (metrics.totalWidth > availableArcPx) {
        fontSize = Math.max(8.6, fontSize * (availableArcPx / metrics.totalWidth) * 0.97);
        metrics = measureAtSize(fontSize);
      }

      if (metrics.totalWidth > availableArcPx * 1.03) return;

      const middleMinutes = (start + end) / 2;
      const middleAngle = minutesToAngle(middleMinutes);
      const normalizedMiddle = ((middleAngle % 360) + 360) % 360;
      const isLeftSide = normalizedMiddle > 90 && normalizedMiddle < 270;
      const direction = isLeftSide ? -1 : 1;

      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("class", "market-label-group");
      group.setAttribute("aria-label", label);
      group.setAttribute("data-market", market.id);

      let cursor = -metrics.totalWidth / 2;

      characters.forEach((character, index) => {
        const characterWidth = metrics.widths[index];
        const characterCenterPx = cursor + characterWidth / 2;
        const angularOffset = (characterCenterPx / radius) * (180 / Math.PI);
        const characterAngle = middleAngle + direction * angularOffset;
        const point = polarToCartesian(radius, characterAngle);
        const rotation = characterAngle + (isLeftSide ? 180 : 0);

        const glyph = document.createElementNS("http://www.w3.org/2000/svg", "text");
        glyph.setAttribute("class", "market-label");
        glyph.setAttribute("x", point.x);
        glyph.setAttribute("y", point.y);
        glyph.setAttribute("font-size", String(fontSize));
        glyph.setAttribute("font-weight", String(fontWeight));
        glyph.setAttribute("text-anchor", "middle");
        glyph.setAttribute("dominant-baseline", "central");
        glyph.setAttribute("alignment-baseline", "central");
        glyph.setAttribute("transform", `rotate(${rotation} ${point.x} ${point.y})`);
        glyph.setAttribute("aria-hidden", "true");
        glyph.textContent = character;

        group.appendChild(glyph);
        cursor += characterWidth + letterGap;
      });

      labelLayer.appendChild(group);
    }

    function getCenterRegionLabel(timezone) {
      if (isFixedUtcZone(timezone)) return "UTC";
      const region = String(timezone).split("/")[0] || "";
      const regionMap = {
        ru: {
          Europe: "Европа",
          America: "Америка",
          Asia: "Азия",
          Australia: "Австралия",
          Africa: "Африка",
          Pacific: "Тихий океан"
        },
        en: {
          Europe: "Europe",
          America: "America",
          Asia: "Asia",
          Australia: "Australia",
          Africa: "Africa",
          Pacific: "Pacific"
        }
      };
      return (regionMap[currentLang] && regionMap[currentLang][region]) || region || translations[currentLang].centerTitle;
    }

    const timezoneShortLabelsRu = {

      "Europe/London": "ЛОН",

      "Asia/Hong_Kong": "Г.-КОНГ",
      "Asia/Singapore": "СИН",
      "Asia/Seoul": "СЕУЛ",
      "Australia/Sydney": "СИД",
      "Pacific/Auckland": "ОКЛ",
      "Pacific/Honolulu": "ГОН",
      "America/New_York": "Н.-ЙОРК",
      "America/Chicago": "ЧИК",
      "America/Los_Angeles": "Л.-АНДЖ.",
      "America/Toronto": "ТОР",
      "America/Vancouver": "ВАН",
      "America/Mexico_City": "МЕХ",
      "America/Sao_Paulo": "С.-ПАУЛУ",
      "America/Argentina/Buenos_Aires": "Б.-АЙРЕС",
      "America/Buenos_Aires": "Б.-АЙРЕС"
    };

    function abbreviateRussianTimezoneCity(label, timezone) {
      const known = timezoneShortLabelsRu[timezone];
      if (known) return known;

      const cleaned = String(label || "")
        .split(",")[0]
        .trim()
        .replace(/\s+/g, " ");

      if (!cleaned) return "—";

      const parts = cleaned.split(/[\s-]+/).filter(Boolean);
      if (parts.length > 1) {
        const firstInitial = parts[0].charAt(0).toUpperCase();
        const lastWord = parts[parts.length - 1].toUpperCase();
        const compactLast = lastWord.length > 8 ? `${lastWord.slice(0, 7)}.` : lastWord;
        return `${firstInitial}.-${compactLast}`;
      }

      const upper = cleaned.toUpperCase();
      if (upper.length <= 5) return upper;
      if (upper.length <= 8) return `${upper.slice(0, 4)}.`;
      return `${upper.slice(0, 5)}.`;
    }

    function shortenCenterCityLabel(label) {
      if (currentLang === "ru") return label;
      const knownShortNames = {
        "Saint Petersburg": "St. Petersburg"
      };
      return knownShortNames[label] || label;
    }

    function transliterateCityToRussian(value) {
      const source = String(value || "").replace(/_/g, " ").trim();
      const special = {
        "Kyiv": "Киев",
        "Kiev": "Киев",
        "Kolkata": "Калькутта",
        "Calcutta": "Калькутта",
        "Buenos Aires": "Буэнос-Айрес",
        "New York": "Нью-Йорк",
        "Los Angeles": "Лос-Анджелес",
        "Saint Petersburg": "Санкт-Петербург",
        "St Petersburg": "Санкт-Петербург"
      };
      if (special[source]) return special[source];

      const replacements = [
        [/shch/gi, "щ"], [/sch/gi, "щ"], [/yo/gi, "ё"], [/yu/gi, "ю"], [/ya/gi, "я"],
        [/zh/gi, "ж"], [/kh/gi, "х"], [/ts/gi, "ц"], [/ch/gi, "ч"], [/sh/gi, "ш"],
        [/ph/gi, "ф"], [/th/gi, "т"], [/qu/gi, "кв"], [/ck/gi, "к"]
      ];
      let result = source.toLowerCase();
      replacements.forEach(([pattern, replacement]) => { result = result.replace(pattern, replacement); });
      const chars = {
        a:"а", b:"б", c:"к", d:"д", e:"е", f:"ф", g:"г", h:"х", i:"и", j:"дж",
        k:"к", l:"л", m:"м", n:"н", o:"о", p:"п", q:"к", r:"р", s:"с", t:"т",
        u:"у", v:"в", w:"в", x:"кс", y:"й", z:"з"
      };
      result = Array.from(result).map(char => chars[char] || char).join("");
      return result.replace(/(^|[\s\-’'])([а-яё])/g, (_, prefix, letter) => prefix + letter.toUpperCase());
    }

    function getLocalizedTimezoneCity(timezone, lang = currentLang) {
      if (isFixedUtcZone(timezone)) return timezone === "UTC+0" ? "UTC±0" : timezone;

      const mapped = timezoneLabels[lang]?.[timezone];
      const raw = String(timezone).split("/").pop().replace(/_/g, " ");

      if (lang === "ru") {
        const russianName = mapped || transliterateCityToRussian(raw);
        return abbreviateRussianTimezoneCity(russianName, timezone);
      }

      return mapped || raw;
    }

    function getCenterCityLabel(timezone) {
      return shortenCenterCityLabel(getLocalizedTimezoneCity(timezone, currentLang));
    }

    function drawMarkets(now) {
      const clockTimezone = getClockTimezone();
      const clockParts = getZonedParts(now, clockTimezone);
      const nowClockMinutes = clockParts.hour * 60 + clockParts.minute + clockParts.second / 60;

      defsLayer.innerHTML = "";
      sessionLayer.innerHTML = "";
      liveLayer.innerHTML = "";
      labelLayer.innerHTML = "";

      const outerRadius = 188;
      const innerRadius = 96;
      const step = markets.length > 1 ? Math.min(28, (outerRadius - innerRadius) / (markets.length - 1)) : 0;
      const strokeWidth = Math.max(21, Math.min(26, step * 0.82 || 24));

      markets.forEach((market, index) => {
        const radius = outerRadius - index * step;
        let labelSegment = null;
        let labelLength = 0;
        const state = getState(market, now);

        market.sessions.forEach(session => {
          const converted = marketSessionToClockMinutes(market, session, now, clockTimezone);
          const segments = normalizeSegments(converted.start, converted.end);

          segments.forEach(segment => {
            const length = segment[1] - segment[0];
            if (length > labelLength) {
              labelLength = length;
              labelSegment = segment;
            }
          });

          if (state.isWeekend) {
            drawNormalizedInterval(radius, converted.start, converted.end, "market-session weekend", strokeWidth, sessionLayer);
            return;
          }

          const isActiveSession = state.isOpen && session === state.activeSession;

          if (!isActiveSession) {
            drawNormalizedInterval(radius, converted.start, converted.end, "market-session closed", strokeWidth, sessionLayer);
            return;
          }

          let nowAligned = nowClockMinutes;
          while (nowAligned < converted.start) nowAligned += 1440;
          while (nowAligned > converted.end) nowAligned -= 1440;

          if (nowAligned > converted.start) {
            drawNormalizedInterval(radius, converted.start, nowAligned, "market-session closed", strokeWidth, sessionLayer);
          }
          if (nowAligned < converted.end) {
            drawNormalizedInterval(radius, nowAligned, converted.end, "market-session open", strokeWidth, sessionLayer);
          }
        });

        if (labelSegment) createArcLabel(market, radius, labelSegment, index, strokeWidth);
      });
    }

    function updateHands(now) {
      const clockTimezone = getClockTimezone();
      const p = getZonedParts(now, clockTimezone);

      const minutes24 = p.hour * 60 + p.minute + p.second / 60;
      const angle24 = minutesToAngle(minutes24);
      const minuteAngle = p.minute * 6 + p.second * 0.1;
      const secondAngle = p.second * 6;

      const pNow = polarToCartesian(145, angle24);
      const pMinute = polarToCartesian(210, minuteAngle);
      const pSecond = polarToCartesian(238, secondAngle);

      nowHand.setAttribute("x1", CX);
      nowHand.setAttribute("y1", CY);
      nowHand.setAttribute("x2", pNow.x);
      nowHand.setAttribute("y2", pNow.y);

      minuteHand.setAttribute("x1", CX);
      minuteHand.setAttribute("y1", CY);
      minuteHand.setAttribute("x2", pMinute.x);
      minuteHand.setAttribute("y2", pMinute.y);

      secondHand.setAttribute("x1", CX);
      secondHand.setAttribute("y1", CY);
      secondHand.setAttribute("x2", pSecond.x);
      secondHand.setAttribute("y2", pSecond.y);

      centerTitle.textContent = getCenterRegionLabel(clockTimezone);
      centerTime.textContent = formatClockDisplay(p.hour, p.minute, p.second, true);
      centerZone.textContent = getCenterCityLabel(clockTimezone);
    }

    function renderCards(now) {
      cards.innerHTML = "";

      markets.forEach(market => {
        const state = getState(market, now);

        if (market.nextChangeAt === undefined || market.lastStatus !== state.isOpen || now.getTime() >= market.nextChangeAt) {
          market.nextChangeAt = findNextChange(market, now, state.isOpen);
          market.lastStatus = state.isOpen;
        }

        const left = market.nextChangeAt - now.getTime();
        const marketTime = formatClockDisplay(state.parts.hour, state.parts.minute, state.parts.second, true);
        const marketDate = formatMarketDate(state.parts);
        const timerLabel = state.isOpen
          ? translations[currentLang].closesIn
          : translations[currentLang].opensIn;
        const progressState = getSessionProgressState(market, state);

        const card = document.createElement("article");
        card.className = `card ${state.isOpen ? "open-card" : "closed-card"} ${progressState.className}-card`;

        card.innerHTML = `
          <div
            class="card-session-bg ${progressState.className}"
            style="--elapsed: ${progressState.elapsed.toFixed(2)}%;"
            aria-hidden="true"
          >
            <div class="card-session-left"></div>
            <div class="card-session-right"></div>
          </div>

          <div class="card-time-box">
            <div class="digital">${marketTime}</div>
            <div class="date-text">${marketDate}</div>
          </div>

          <div class="card-main">
            <img class="flag" src="${market.flagImg}" alt="">
            <div class="name">${locationLine(market)}</div>

            <div class="trade-row">
              <div class="trade-time">
                ${tradeTimeText(market, now)}
              </div>

              <div class="status-row">
                <div class="timer-pill">
                  ${timerLabel} ${formatDuration(left)}
                </div>
              </div>
            </div>
          </div>
        `;

        cards.appendChild(card);
      });
    }

    function updateSettingsButtons() {
      langRuBtn.classList.toggle("active", currentLang === "ru");
      langEnBtn.classList.toggle("active", currentLang === "en");
      hour24Btn.classList.toggle("active", currentHourFormat === "24");
      hour12Btn.classList.toggle("active", currentHourFormat === "12");
      themeLightBtn.classList.toggle("active", currentThemeMode === "light");
      themeDarkBtn.classList.toggle("active", currentThemeMode === "dark");
      themeAutoBtn.classList.toggle("active", currentThemeMode === "system");
    }

    function updateStaticTexts() {
      const t = translations[currentLang];

      document.documentElement.lang = currentLang;
      document.title = t.pageTitle;
      pageTitle.textContent = t.pageTitle;

      settingsTitle.textContent = t.settings;
      timezoneLabel.textContent = t.timezone;
      themeModeLabel.textContent = t.themeMode;
      languageLabel.textContent = t.language;
      hourFormatLabel.textContent = t.timeFormat;
      themeLightBtn.textContent = t.themeLight;
      themeDarkBtn.textContent = t.themeDark;
      themeAutoBtn.textContent = t.themeAuto;
      themeLightBtn.setAttribute("aria-label", t.themeLightAria);
      themeDarkBtn.setAttribute("aria-label", t.themeDarkAria);
      themeAutoBtn.setAttribute("aria-label", t.themeAutoAria);
      hour24Btn.textContent = t.format24;
      hour12Btn.textContent = t.format12;
      settingsToggle.setAttribute("aria-label", t.settings);

      updateSettingsButtons();
    }

    function resetMarketCache() {
      markets.forEach(market => {
        market.nextChangeAt = undefined;
        market.lastStatus = undefined;
      });
    }

    function setLanguage(lang) {
      if (!translations[lang]) return;

      currentLang = lang;
      localStorage.setItem("forexClockLang", currentLang);

      updateStaticTexts();
      buildTimezoneOptions();
      resetMarketCache();
      update();
    }

    function setHourFormat(format) {
      if (!["12", "24"].includes(format)) return;
      currentHourFormat = format;
      localStorage.setItem("forexClockHourFormat", currentHourFormat);
      updateSettingsButtons();
      update();
    }

    function setThemeMode(mode) {
      if (!["light", "dark", "system"].includes(mode)) return;
      currentThemeMode = mode;
      localStorage.setItem("forexClockThemeMode", currentThemeMode);
      applyThemeMode();
      updateSettingsButtons();
      update();
    }

    function openSettings() {
      settingsPopover.hidden = false;
      settingsToggle.setAttribute("aria-expanded", "true");
    }

    function closeSettings() {
      settingsPopover.hidden = true;
      settingsToggle.setAttribute("aria-expanded", "false");
    }

    function toggleSettings() {
      if (settingsPopover.hidden) openSettings();
      else closeSettings();
    }

    function update() {
      const now = new Date();
      updateHands(now);
      drawMarkets(now);
      renderCards(now);
    }

    applyThemeMode();
    updateStaticTexts();
    buildTimezoneOptions();
    drawBaseDial();
    update();

    settingsToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      closeTimezoneMenu();
      toggleSettings();
    });

    settingsPopover.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    timezoneButton.addEventListener("click", (event) => {
      event.stopPropagation();
      toggleTimezoneMenu();
    });

    timezoneMenu.addEventListener("click", event => {
      event.stopPropagation();
    });

    document.addEventListener("click", () => {
      closeSettings();
      closeTimezoneMenu();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeSettings();
        closeTimezoneMenu();
      }
    });

    langRuBtn.addEventListener("click", () => setLanguage("ru"));
    langEnBtn.addEventListener("click", () => setLanguage("en"));
    hour24Btn.addEventListener("click", () => setHourFormat("24"));
    hour12Btn.addEventListener("click", () => setHourFormat("12"));
    themeLightBtn.addEventListener("click", () => setThemeMode("light"));
    themeDarkBtn.addEventListener("click", () => setThemeMode("dark"));
    themeAutoBtn.addEventListener("click", () => setThemeMode("system"));

    if (systemThemeMedia.addEventListener) {
      systemThemeMedia.addEventListener("change", () => {
        if (currentThemeMode === "system") {
          applyThemeMode();
          update();
        }
      });
    } else if (systemThemeMedia.addListener) {
      systemThemeMedia.addListener(() => {
        if (currentThemeMode === "system") {
          applyThemeMode();
          update();
        }
      });
    }

    clockTimezoneSelect.addEventListener("change", () => {
      resetMarketCache();
      update();
    });

    setInterval(update, 1000);
  </script>
